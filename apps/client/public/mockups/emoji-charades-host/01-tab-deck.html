<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emoji Charades Host — 01 Tab Deck</title>
    <style>
      :root {
        --bg: #121212;
        --surface: #1c1c1c;
        --surface-alt: #242424;
        --text: #ffffff;
        --muted: #a3a3a3;
        --primary: #f97316;
        --heat: #ef4444;
        --gold: #fbbf24;
        --teamA: #f97316;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100dvh; overflow: hidden;
        background: radial-gradient(ellipse at top, #2a1306 0%, #0f0a08 60%, #050505 100%);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      .stage {
        height: 100dvh;
        display: grid; grid-template-rows: auto 1fr;
        gap: 0.6rem; padding: clamp(0.6rem, 1vw, 1rem);
      }
      .mini-rail {
        display: flex; align-items: center; gap: 1rem;
        padding: 0.35rem 0.5rem;
        font-size: 0.74rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted);
      }
      .mini-rail .round { color: var(--primary); }
      .mini-rail .pill { display: inline-flex; align-items: center; gap: 0.45rem; color: var(--text); }
      .mini-rail .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--teamA); box-shadow: 0 0 8px var(--teamA);
      }
      .mini-rail .timer {
        margin-left: auto; font-family: ui-monospace, monospace;
        font-size: 1.05rem; color: var(--primary);
        font-variant-numeric: tabular-nums; letter-spacing: 0;
      }

      main.middle {
        display: grid;
        grid-template-columns: 1fr clamp(250px, 25vw, 340px);
        gap: clamp(0.7rem, 1.2vw, 1.2rem); min-height: 0;
      }

      /* Left: canvas over tabbed picker */
      .picker-col { display: grid; grid-template-rows: auto auto 1fr; gap: 0.6rem; min-height: 0; }

      .canvas {
        background: linear-gradient(180deg, #1a0e05 0%, #0a0604 100%);
        border: 2px solid #3a200d; border-radius: 14px;
        padding: 0.7rem 0.9rem; min-height: 96px;
        display: flex; align-items: center; gap: 0.15rem; flex-wrap: wrap;
        font-size: clamp(1.6rem, 3vw, 2.6rem); line-height: 1.1;
        box-shadow: inset 0 0 24px rgba(0,0,0,0.5);
      }
      .canvas .caret {
        width: 3px; height: 1.6em; background: var(--primary);
        animation: blink 1s steps(2) infinite; margin-left: 0.15rem;
      }
      @keyframes blink { 50% { opacity: 0; } }

      .tabs { display: flex; gap: 0.35rem; overflow: hidden; }
      .tabs button {
        flex: 1; background: var(--surface); border: 1px solid #3a200d;
        color: var(--muted); border-radius: 10px 10px 0 0; min-height: 48px;
        font-family: inherit; font-weight: 800; cursor: pointer;
        text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.6rem;
        display: grid; place-items: center; gap: 0.1rem; padding: 0.3rem;
      }
      .tabs button .ico { font-size: 1.3rem; }
      .tabs button.active {
        background: var(--surface-alt); color: var(--gold);
        border-color: var(--gold); border-bottom-color: var(--surface-alt);
      }

      .grid {
        background: var(--surface-alt); border: 1px solid #3a200d;
        border-top: none; border-radius: 0 0 14px 14px;
        padding: 0.6rem; min-height: 0; overflow: hidden;
        display: grid; grid-template-columns: repeat(10, 1fr);
        gap: 0.3rem; align-content: start;
      }
      .grid span {
        aspect-ratio: 1; display: grid; place-items: center;
        font-size: clamp(1.3rem, 2.4vw, 2rem);
        border-radius: 8px; cursor: pointer;
        background: rgba(255,255,255,0.03);
      }
      .grid span:hover { background: rgba(251,191,36,0.18); }

      /* Right: deck */
      aside.deck { display: flex; flex-direction: column; gap: 0.7rem; min-height: 0; }
      .subject-card {
        background: linear-gradient(180deg, #3a1d09 0%, #1a0c04 100%);
        border: 2px solid var(--gold); border-radius: 14px;
        padding: 0.8rem 1rem; text-align: center;
        box-shadow: 0 0 24px rgba(251,191,36,0.16) inset;
      }
      .subject-card .label {
        text-transform: uppercase; letter-spacing: 0.3em;
        font-size: 0.62rem; color: var(--gold); font-weight: 800;
      }
      .subject-card .text {
        font-family: "Georgia", serif; font-style: italic; font-weight: 700;
        font-size: clamp(1.4rem, 2vw, 2rem);
        text-shadow: 0 0 12px rgba(251,191,36,0.35);
      }
      .subject-card .remaining {
        margin-top: 0.3rem; font-size: 0.6rem; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700;
      }
      .verdict {
        flex: 1; min-height: 76px; border: 2px solid; border-radius: 14px;
        cursor: pointer; display: grid; place-items: center;
        align-content: center; gap: 0.3rem;
        font-family: inherit; font-weight: 900; text-transform: uppercase;
        letter-spacing: 0.1em; font-size: 1.15rem;
        box-shadow: 0 4px 0 rgba(0,0,0,0.45), 0 6px 14px rgba(0,0,0,0.35);
      }
      .verdict .icon { font-size: 1.9rem; line-height: 1; }
      .verdict .sub { font-size: 0.62rem; letter-spacing: 0.24em; opacity: 0.8; }
      .verdict.got {
        background: radial-gradient(ellipse at top, #2fb86c 0%, #0e6a36 100%);
        color: #061a0c; border-color: #5fe093;
      }
      .verdict.skip {
        background: radial-gradient(ellipse at top, #f04040 0%, #800f0f 100%);
        color: #1c0303; border-color: #ff8a8a;
      }
      .deck-rows { display: flex; gap: 0.5rem; }
      .deck-rows button {
        flex: 1; background: var(--surface); border: 1px solid #3a200d;
        color: var(--text); border-radius: 10px; min-height: 52px;
        font-family: inherit; font-weight: 800; cursor: pointer;
        text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem;
      }
      .deck-rows button:hover { border-color: var(--gold); color: var(--gold); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mini-rail">
        <span class="round">Round 2</span>
        <span>Mango Habanero</span>
        <span>Emoji Charades</span>
        <span class="pill"><span class="dot"></span>Team Heat · +3 pending</span>
        <span class="timer">0:41</span>
      </div>

      <main class="middle">
        <div class="picker-col">
          <div class="canvas">
            <span>🦖</span><span>🌴</span><span>🏝️</span><span>🚙</span><span>⚡</span><span>🧬</span><span>🥼</span><span>👨‍🔬</span><span>🚨</span><span>🌧️</span><span>🦕</span><span>🥚</span><span>🔦</span><span>🚁</span><span>💨</span><span>😱</span><span>🌿</span><span>🔬</span><span>⛓️</span><span>🍫</span>
            <span class="caret"></span>
          </div>

          <div class="tabs">
            <button><span class="ico">😀</span>Faces</button>
            <button class="active"><span class="ico">🦖</span>Animals</button>
            <button><span class="ico">🍕</span>Food</button>
            <button><span class="ico">🚙</span>Travel</button>
            <button><span class="ico">⚽</span>Activity</button>
            <button><span class="ico">💡</span>Objects</button>
            <button><span class="ico">🏝️</span>Places</button>
            <button><span class="ico">❤️</span>Symbols</button>
          </div>

          <div class="grid">
            <span>🦖</span><span>🦕</span><span>🐊</span><span>🦎</span><span>🐍</span><span>🐢</span><span>🐘</span><span>🦏</span><span>🦛</span><span>🐪</span>
            <span>🦒</span><span>🦘</span><span>🐃</span><span>🐂</span><span>🐄</span><span>🐎</span><span>🐖</span><span>🐏</span><span>🐑</span><span>🦙</span>
            <span>🐐</span><span>🦌</span><span>🐕</span><span>🐩</span><span>🦮</span><span>🐈</span><span>🐓</span><span>🦃</span><span>🦚</span><span>🦜</span>
            <span>🦢</span><span>🦩</span><span>🕊️</span><span>🐇</span><span>🦝</span><span>🦨</span><span>🦡</span><span>🦫</span><span>🦦</span><span>🦥</span>
            <span>🐁</span><span>🐀</span><span>🐿️</span><span>🦔</span><span>🐻</span><span>🐨</span><span>🐼</span><span>🦥</span><span>🐵</span><span>🦍</span>
            <span>🦧</span><span>🐺</span><span>🦊</span><span>🦁</span><span>🐯</span><span>🐅</span><span>🐆</span><span>🐴</span><span>🦄</span><span>🐮</span>
            <span>🐷</span><span>🐗</span><span>🐽</span><span>🐸</span><span>🐵</span><span>🙈</span><span>🙉</span><span>🙊</span><span>🐒</span><span>🦈</span>
            <span>🐬</span><span>🐳</span><span>🐋</span><span>🐟</span><span>🐠</span><span>🐡</span><span>🦐</span><span>🦞</span><span>🦀</span><span>🐙</span>
          </div>
        </div>

        <aside class="deck">
          <div class="subject-card">
            <div class="label">★ Your Subject ★</div>
            <div class="text">Jurassic Park</div>
            <div class="remaining">14 subjects left</div>
          </div>
          <button class="verdict got">
            <span class="icon">✓</span>
            <span>Got It</span>
            <span class="sub">+1 point</span>
          </button>
          <button class="verdict skip">
            <span class="icon">↷</span>
            <span>Skip</span>
            <span class="sub">no points</span>
          </button>
          <div class="deck-rows">
            <button>⌫ Back</button>
            <button>✕ Clear</button>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
