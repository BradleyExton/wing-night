<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emoji Charades Host — 04 Hybrid (click search to summon keyboard)</title>
    <style>
      :root {
        --bg: #121212;
        --surface: #1c1c1c;
        --surface-alt: #242424;
        --text: #ffffff;
        --muted: #a3a3a3;
        --primary: #f97316;
        --heat: #ef4444;
        --gold: #fbbf24;
        --teamA: #f97316;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100dvh; overflow: hidden;
        background: radial-gradient(ellipse at top, #2a1306 0%, #0f0a08 60%, #050505 100%);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      .stage {
        height: 100dvh; display: grid; grid-template-rows: auto 1fr;
        gap: 0.6rem; padding: clamp(0.6rem, 1vw, 1rem);
      }
      .mini-rail {
        display: flex; align-items: center; gap: 1rem; padding: 0.35rem 0.5rem;
        font-size: 0.74rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted);
      }
      .mini-rail .round { color: var(--primary); }
      .mini-rail .pill { display: inline-flex; align-items: center; gap: 0.45rem; color: var(--text); }
      .mini-rail .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--teamA); box-shadow: 0 0 8px var(--teamA);
      }
      .mini-rail .timer {
        margin-left: auto; font-family: ui-monospace, monospace;
        font-size: 1.05rem; color: var(--primary); font-variant-numeric: tabular-nums;
      }

      main.middle {
        display: grid; grid-template-columns: 1fr clamp(250px, 25vw, 340px);
        gap: clamp(0.7rem, 1.2vw, 1.2rem); min-height: 0;
      }
      .picker-col {
        display: grid; grid-template-rows: auto auto auto 1fr; gap: 0.55rem; min-height: 0;
      }

      .canvas {
        background: linear-gradient(180deg, #1a0e05 0%, #0a0604 100%);
        border: 2px solid #3a200d; border-radius: 14px;
        padding: 0.6rem 0.9rem; min-height: 92px;
        display: flex; align-items: center; gap: 0.15rem; flex-wrap: wrap;
        font-size: clamp(1.5rem, 2.8vw, 2.4rem); line-height: 1.1;
        box-shadow: inset 0 0 24px rgba(0,0,0,0.5);
      }
      .canvas .caret {
        width: 3px; height: 1.5em; background: var(--primary);
        animation: blink 1s steps(2) infinite; margin-left: 0.15rem;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* Search is always present but costs no height until focused. */
      .search {
        display: flex; align-items: center; gap: 0.7rem;
        background: var(--surface-alt); border: 2px solid #3a200d;
        border-radius: 12px; padding: 0.45rem 0.9rem; min-height: 52px;
        cursor: text; transition: border-color 140ms ease, box-shadow 140ms ease;
      }
      .search .ico { font-size: 1.2rem; opacity: 0.65; }
      .search .ph {
        color: var(--muted); font-size: clamp(0.9rem, 1.5vw, 1.15rem); font-weight: 600;
      }
      .search .kbd-hint {
        margin-left: auto; font-size: 0.56rem; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.2em; font-weight: 800;
        border: 1px solid #3a200d; border-radius: 6px; padding: 0.25rem 0.5rem;
      }
      body.searching .search {
        border-color: var(--primary); box-shadow: 0 0 22px rgba(249,115,22,0.22);
      }
      body.searching .search .ph { color: var(--text); }
      body.searching .search .kbd-hint { display: none; }

      .tabs { display: flex; gap: 0.3rem; }
      .tabs button {
        flex: 1; background: var(--surface); border: 1px solid #3a200d;
        color: var(--muted); border-radius: 10px 10px 0 0; min-height: 46px;
        font-family: inherit; font-weight: 800; cursor: pointer;
        text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.54rem;
        display: grid; place-items: center; gap: 0.05rem; padding: 0.25rem;
      }
      .tabs button .ico { font-size: 1.15rem; }
      .tabs button.active {
        background: var(--surface-alt); color: var(--gold);
        border-color: var(--gold); border-bottom-color: var(--surface-alt);
      }

      .grid-wrap {
        position: relative; min-height: 0;
        background: var(--surface-alt); border: 1px solid #3a200d;
        border-top: none; border-radius: 0 0 14px 14px;
      }
      .grid {
        height: 100%; overflow-y: auto; padding: 0.55rem;
        display: grid; grid-template-columns: repeat(10, 1fr);
        gap: 0.28rem; align-content: start;
        scrollbar-width: thin; scrollbar-color: #3a200d transparent;
      }
      .grid .sect {
        grid-column: 1 / -1; font-size: 0.52rem; color: var(--muted);
        font-weight: 800; text-transform: uppercase; letter-spacing: 0.22em;
        padding: 0.45rem 0.2rem 0.2rem;
      }
      .grid .sect:first-child { padding-top: 0.1rem; }
      .grid span.e {
        aspect-ratio: 1; display: grid; place-items: center;
        font-size: clamp(1.25rem, 2.3vw, 1.95rem);
        border-radius: 8px; cursor: pointer; background: rgba(255,255,255,0.03);
      }
      .grid span.e:hover { background: rgba(251,191,36,0.18); }
      /* fade marks that the grid continues below */
      .grid-wrap::after {
        content: ""; position: absolute; left: 1px; right: 1px; bottom: 1px; height: 46px;
        border-radius: 0 0 13px 13px; pointer-events: none;
        background: linear-gradient(180deg, rgba(36,36,36,0) 0%, rgba(30,26,22,0.96) 100%);
      }

      /* Keyboard: only present while searching. Overlays the grid, doesn't
         permanently reserve half the tablet the way 02 does. */
      .keyboard {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
        display: none; grid-template-rows: repeat(4, 1fr); gap: 0.35rem;
        background: linear-gradient(180deg, #1a130d 0%, #0a0705 100%);
        border-top: 2px solid var(--primary); border-radius: 0 0 13px 13px;
        padding: 0.5rem; height: 58%;
        box-shadow: 0 -14px 34px rgba(0,0,0,0.6);
      }
      body.searching .keyboard { display: grid; }
      body.searching .grid-wrap::after { display: none; }
      .krow { display: flex; gap: 0.3rem; justify-content: center; }
      .krow button {
        flex: 1 1 0; min-width: 0; min-height: 40px;
        background: var(--surface-alt); border: 1px solid #3a200d;
        color: var(--text); border-radius: 8px;
        font-family: inherit; font-weight: 700;
        font-size: clamp(0.8rem, 1.4vw, 1.05rem); cursor: pointer;
      }
      .krow button:hover { border-color: var(--gold); color: var(--gold); }
      .krow button.wide { flex: 2 1 0; }
      .krow button.space { flex: 6 1 0; }
      .krow button.done { flex: 2 1 0; background: #2a1708; border-color: var(--primary); color: var(--primary); }

      /* Right deck — identical to 01 so only the picker differs. */
      aside.deck { display: flex; flex-direction: column; gap: 0.7rem; min-height: 0; }
      .subject-card {
        background: linear-gradient(180deg, #3a1d09 0%, #1a0c04 100%);
        border: 2px solid var(--gold); border-radius: 14px;
        padding: 0.8rem 1rem; text-align: center;
        box-shadow: 0 0 24px rgba(251,191,36,0.16) inset;
      }
      .subject-card .label {
        text-transform: uppercase; letter-spacing: 0.3em;
        font-size: 0.62rem; color: var(--gold); font-weight: 800;
      }
      .subject-card .text {
        font-family: "Georgia", serif; font-style: italic; font-weight: 700;
        font-size: clamp(1.4rem, 2vw, 2rem);
        text-shadow: 0 0 12px rgba(251,191,36,0.35);
      }
      .subject-card .remaining {
        margin-top: 0.3rem; font-size: 0.6rem; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700;
      }
      .verdict {
        flex: 1; min-height: 76px; border: 2px solid; border-radius: 14px;
        cursor: pointer; display: grid; place-items: center;
        align-content: center; gap: 0.3rem;
        font-family: inherit; font-weight: 900; text-transform: uppercase;
        letter-spacing: 0.1em; font-size: 1.15rem;
        box-shadow: 0 4px 0 rgba(0,0,0,0.45), 0 6px 14px rgba(0,0,0,0.35);
      }
      .verdict .icon { font-size: 1.9rem; line-height: 1; }
      .verdict .sub { font-size: 0.62rem; letter-spacing: 0.24em; opacity: 0.8; }
      .verdict.got {
        background: radial-gradient(ellipse at top, #2fb86c 0%, #0e6a36 100%);
        color: #061a0c; border-color: #5fe093;
      }
      .verdict.skip {
        background: radial-gradient(ellipse at top, #f04040 0%, #800f0f 100%);
        color: #1c0303; border-color: #ff8a8a;
      }
      .deck-rows { display: flex; gap: 0.5rem; }
      .deck-rows button {
        flex: 1; background: var(--surface); border: 1px solid #3a200d;
        color: var(--text); border-radius: 10px; min-height: 52px;
        font-family: inherit; font-weight: 800; cursor: pointer;
        text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem;
      }
      .deck-rows button:hover { border-color: var(--gold); color: var(--gold); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mini-rail">
        <span class="round">Round 2</span>
        <span>Mango Habanero</span>
        <span>Emoji Charades</span>
        <span class="pill"><span class="dot"></span>Team Heat · +3 pending</span>
        <span class="timer">0:41</span>
      </div>

      <main class="middle">
        <div class="picker-col">
          <div class="canvas">
            <span>🦖</span><span>🌴</span><span>🏝️</span><span>🚙</span><span>⚡</span><span>🧬</span><span>🥼</span><span>👨‍🔬</span><span>🚨</span><span>🌧️</span><span>🦕</span><span>🥚</span><span>🔦</span><span>🚁</span><span>💨</span><span>😱</span><span>🌿</span><span>🔬</span><span>⛓️</span><span>🍫</span>
            <span class="caret"></span>
          </div>

          <div class="search" id="search">
            <span class="ico">🔍</span>
            <span class="ph" id="ph">Search all emoji…</span>
            <span class="kbd-hint">Tap for keyboard</span>
          </div>

          <div class="tabs">
            <button class="active"><span class="ico">⭐</span>Top</button>
            <button><span class="ico">😀</span>Faces</button>
            <button><span class="ico">🙋</span>People</button>
            <button><span class="ico">🦖</span>Animals</button>
            <button><span class="ico">🍕</span>Food</button>
            <button><span class="ico">🚙</span>Travel</button>
            <button><span class="ico">💡</span>Objects</button>
            <button><span class="ico">❤️</span>Symbols</button>
          </div>

          <div class="grid-wrap">
            <div class="grid" id="grid"></div>
            <div class="keyboard">
              <div class="krow">
                <button>q</button><button>w</button><button>e</button><button>r</button><button>t</button>
                <button>y</button><button>u</button><button>i</button><button>o</button><button>p</button>
              </div>
              <div class="krow">
                <button>a</button><button>s</button><button>d</button><button>f</button><button>g</button>
                <button>h</button><button>j</button><button>k</button><button>l</button>
              </div>
              <div class="krow">
                <button class="wide">⇧</button>
                <button>z</button><button>x</button><button>c</button><button>v</button>
                <button>b</button><button>n</button><button>m</button>
                <button class="wide">⌫</button>
              </div>
              <div class="krow">
                <button class="wide">123</button>
                <button class="space">space</button>
                <button class="done" id="done">done</button>
              </div>
            </div>
          </div>
        </div>

        <aside class="deck">
          <div class="subject-card">
            <div class="label">★ Your Subject ★</div>
            <div class="text">Jurassic Park</div>
            <div class="remaining">14 subjects left</div>
          </div>
          <button class="verdict got">
            <span class="icon">✓</span>
            <span>Got It</span>
            <span class="sub">+1 point</span>
          </button>
          <button class="verdict skip">
            <span class="icon">↷</span>
            <span>Skip</span>
            <span class="sub">no points</span>
          </button>
          <div class="deck-rows">
            <button>⌫ Back</button>
            <button>✕ Clear</button>
          </div>
        </aside>
      </main>
    </div>

    <script>
      // "Top" is the landing tab: frequency-ranked for charades, not alphabetical.
      // This is variant 03's premise absorbed as the default surface.
      const SECTIONS = [
        ["Used this turn", ["🦖","🌴","🏝️","🚙","⚡","🧬","🥼","👨‍🔬","🚨","🌧️"]],
        ["Most used tonight", ["😀","😱","❤️","🔥","👀","🏃","🎬","🎵","💀","🚗","🏠","💡","🍕","⭐","💰","👑","🐶","☠️","🌊","⏰"]],
        ["Charades staples", [
          "😍","😭","😡","🤔","😂","🥶","🤮","🥳","😴","🤯",
          "👶","👴","👩","👨","🤰","💃","🕺","🙋","🤷","🙅",
          "🤸","🧗","🏊","🚶","👏","🙌","👊","🖐️","🧠","👅",
          "🐱","🐭","🦁","🐷","🐸","🦈","🐙","🦋","🕷️","🐝",
          "🍔","🍟","🌮","🍺","☕","🎂","🍎","🥚","🍫","🧀",
          "🚀","✈️","🚁","🚂","⛵","🏔️","🌋","🏝️","🌙","☀️",
          "📱","💻","🔑","🔦","🧲","⚓","🔬","🪓","⛓️","🎈"
        ]]
      ];

      const grid = document.getElementById("grid");
      SECTIONS.forEach(([title, list]) => {
        const h = document.createElement("div");
        h.className = "sect";
        h.textContent = title;
        grid.appendChild(h);
        list.forEach((emoji) => {
          const s = document.createElement("span");
          s.className = "e";
          s.textContent = emoji;
          grid.appendChild(s);
        });
      });

      // Keyboard is summoned, not permanent — the whole point of the hybrid.
      const search = document.getElementById("search");
      const ph = document.getElementById("ph");
      search.addEventListener("click", () => {
        document.body.classList.add("searching");
        ph.textContent = "dino|";
      });
      document.getElementById("done").addEventListener("click", (ev) => {
        ev.stopPropagation();
        document.body.classList.remove("searching");
        ph.textContent = "Search all emoji…";
      });
    </script>
  </body>
</html>
