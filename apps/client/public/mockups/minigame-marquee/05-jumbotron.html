<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minigame Marquee — 05 Jumbotron (click: next turn · U: last 15s)</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* An arena LED board. Black bezel, amber dot matrix, a red segment clock.
         Blunt and loud, the way a scoreboard is. */
      .board {
        position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem;
        background: #000; border: 6px solid #2a2a2a; border-radius: 10px;
        padding: clamp(0.7rem, 1.3vh, 1.2rem) clamp(1.6rem, 2.6vw, 2.6rem);
        box-shadow: 0 14px 30px rgba(0,0,0,0.7), inset 0 0 0 2px #0b0b0b, inset 0 0 40px rgba(251,191,36,0.06);
      }
      .board::before { /* the dot matrix */
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.55;
        background: radial-gradient(circle, rgba(251,191,36,0.12) 1.1px, transparent 1.6px) 0 0 / 6px 6px;
      }
      .board::after { /* scanlines */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 3px);
      }
      .rivet { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #777, #222); }
      .rivet.tl { top: 6px; left: 6px; } .rivet.tr { top: 6px; right: 6px; } .rivet.bl { bottom: 6px; left: 6px; } .rivet.br { bottom: 6px; right: 6px; }
      .led { font-family: "Orbitron", sans-serif; font-weight: 800; text-transform: uppercase; }
      .team { color: var(--gold); font-size: clamp(1.4rem, 2.3vw, 2.6rem); letter-spacing: 0.08em; text-shadow: 0 0 10px rgba(251,191,36,0.6); display: flex; align-items: baseline; gap: 0.6em; }
      .team small { font-size: 0.55em; color: var(--success); text-shadow: 0 0 10px rgba(34,197,94,0.6); }
      .show { text-align: center; color: #ffb000; font-size: clamp(0.8rem, 1.2vw, 1.3rem); letter-spacing: 0.4em; opacity: 0.85; }
      .show::before, .show::after { content: "▮▮ "; opacity: 0.5; } .show::after { content: " ▮▮"; }
      .meta { display: flex; justify-content: flex-end; align-items: center; gap: clamp(1rem, 2vw, 2rem); }
      .count { color: #ffb000; font-size: clamp(0.7rem, 1vw, 1.1rem); letter-spacing: 0.2em; opacity: 0.8; }
      .clock {
        color: var(--heat); font-size: clamp(2rem, 3.2vw, 3.6rem); letter-spacing: 0.02em; line-height: 1;
        text-shadow: 0 0 6px rgba(239,68,68,0.9), 0 0 18px rgba(239,68,68,0.55);
        background: #120404; border: 2px solid #3a0d0d; padding: 0.08em 0.4em; border-radius: 4px;
      }
      body.urgent .clock { animation: heatpulse 0.65s ease-in-out infinite; background: #2a0606; }
      body.timeup .clock { font-size: clamp(0.9rem, 1.3vw, 1.4rem); letter-spacing: 0.16em; padding-block: 0.8em; }
    </style>
  </head>
  <body>
    <div class="stage">
      <header class="board">
        <i class="rivet tl"></i><i class="rivet tr"></i><i class="rivet bl"></i><i class="rivet br"></i>
        <div class="team led"><span data-slot="team">Team</span><small data-slot="pending">+0</small></div>
        <div class="show led" data-slot="title">Title</div>
        <div class="meta"><span class="count led" data-slot="counter">Counter</span><span class="clock led tnum" data-slot="clock">0:00</span></div>
      </header>
      <div class="body"><span>game body</span></div>
    </div>
    <p class="legend"><b>click</b> next turn · <b>U</b> last 15s</p>
    <script src="kit.js"></script>
  </body>
</html>
