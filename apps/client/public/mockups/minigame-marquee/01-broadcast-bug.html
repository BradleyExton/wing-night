<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minigame Marquee — 01 Broadcast Bug (click: next turn · U: last 15s)</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* A sports score bug: compact, left-anchored, hard-edged, skewed. Nothing
         spans the width; the stage stays open to the right of it. */
      .bug {
        display: flex; align-items: stretch; gap: 0; width: max-content;
        transform: skewX(-8deg); transform-origin: left bottom;
        filter: drop-shadow(0 10px 22px rgba(0,0,0,0.6));
        font-size: clamp(0.8rem, 1.15vw, 1.3rem);
      }
      .bug > * { display: flex; align-items: center; padding: 0 1.3em; }
      .bug > * > * { transform: skewX(8deg); }
      .live {
        background: var(--heat); color: #fff; font-weight: 900; letter-spacing: 0.22em;
        font-size: 0.7em; writing-mode: vertical-rl; transform: rotate(180deg) skewX(-8deg);
        padding: 0.6em 0.5em; justify-content: center;
      }
      .live > span { transform: none; display: inline-flex; align-items: center; gap: 0.5em; }
      .live i { width: 0.7em; height: 0.7em; border-radius: 50%; background: #fff; animation: heatpulse 1.1s ease-in-out infinite; }
      .team {
        background: var(--team); color: #0b0b0b; padding-block: 0.35em;
        font-family: "Anton", var(--team-font); font-size: 2.2em; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1;
      }
      .team small {
        margin-left: 0.5em; font-family: ui-monospace, monospace; font-size: 0.5em; font-weight: 900;
        background: #0b0b0b; color: var(--team); padding: 0.15em 0.45em; letter-spacing: 0.06em;
      }
      .show { background: #0b0b0b; color: var(--gold); font-weight: 900; letter-spacing: 0.28em; text-transform: uppercase; font-size: 0.85em; border-top: 3px solid var(--gold); }
      .count { background: var(--surface-alt); color: var(--muted); font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.75em; }
      .clock {
        background: var(--primary); color: #0b0b0b; font-family: ui-monospace, monospace; font-weight: 900;
        font-size: 2em; letter-spacing: -0.02em; position: relative; overflow: hidden;
      }
      .clock::after { /* drain: what's left of the turn, as a fill */
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--remaining) * 100%);
        background: rgba(255,255,255,0.22); transition: width 1s linear;
      }
      .clock > span { position: relative; z-index: 1; }
      body.urgent .clock { background: var(--heat); color: #fff; animation: heatpulse 0.65s ease-in-out infinite; }
      body.timeup .clock { background: #0b0b0b; color: var(--heat); font-size: 0.9em; letter-spacing: 0.16em; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bug">
        <div class="live"><span><i></i>LIVE</span></div>
        <div class="team"><span><span data-slot="team">Team</span><small data-slot="pending">+0</small></span></div>
        <div class="show"><span data-slot="title">Title</span></div>
        <div class="count"><span data-slot="counter">Counter</span></div>
        <div class="clock"><span class="tnum" data-slot="clock">0:00</span></div>
      </div>
      <div class="body"><span>game body</span></div>
    </div>
    <p class="legend"><b>click</b> next turn · <b>U</b> last 15s</p>
    <script src="kit.js"></script>
  </body>
</html>
