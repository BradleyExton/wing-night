<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minigame Marquee — 06 Heat Line (click: next turn · U: last 15s)</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* Anti-chrome. No frame at all: a kicker, a huge team name, and the
         clock as a full-width line that burns down. Time is space here; the
         digits are a footnote. */
      .row { display: grid; grid-template-rows: auto auto; gap: clamp(0.5rem, 1vh, 0.9rem); padding: 0 clamp(0.4rem, 0.8vw, 0.8rem); }
      .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; }
      .kicker { display: flex; align-items: center; gap: 0.8em; color: var(--gold); font-weight: 900; letter-spacing: 0.34em; text-transform: uppercase; font-size: clamp(0.65rem, 0.95vw, 1rem); }
      .kicker i { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--team); box-shadow: 0 0 10px var(--team); }
      .team { font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.95; font-size: clamp(2.2rem, 4vw, 4.4rem); display: flex; align-items: baseline; gap: 0.4em; }
      .team small { font-family: ui-monospace, monospace; font-size: 0.4em; font-weight: 900; color: var(--gold); letter-spacing: 0; }
      .right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.3em; }
      .count { color: var(--muted); font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; font-size: clamp(0.65rem, 0.95vw, 1rem); }
      .digits { font-family: ui-monospace, monospace; font-weight: 900; font-size: clamp(1.2rem, 1.9vw, 2.1rem); color: var(--primary); letter-spacing: -0.02em; line-height: 1; transition: color 300ms ease; }
      .line { position: relative; height: clamp(6px, 0.9vh, 10px); border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
      .line::before {
        content: ""; position: absolute; inset: 0; width: calc(var(--remaining) * 100%); border-radius: inherit;
        background: linear-gradient(90deg, var(--heat), var(--primary) 30%, var(--gold));
        box-shadow: 0 0 14px rgba(249,115,22,0.6); transition: width 1s linear;
      }
      .line::after { /* the burning tip */
        content: ""; position: absolute; top: -3px; bottom: -3px; width: 6px; border-radius: 3px; background: #fff;
        left: calc(var(--remaining) * 100% - 3px); box-shadow: 0 0 12px #fff, 0 0 24px var(--primary); transition: left 1s linear;
      }
      body.urgent .digits { color: var(--heat); animation: heatpulse 0.65s ease-in-out infinite; }
      body.urgent .line::before { background: var(--heat); box-shadow: 0 0 18px var(--heat); animation: heatpulse 0.65s ease-in-out infinite; }
      body.timeup .digits { color: var(--heat); font-size: clamp(0.8rem, 1.2vw, 1.3rem); letter-spacing: 0.16em; }
      body.timeup .line::after { display: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <header class="row">
        <div class="top">
          <div>
            <div class="kicker"><i></i><span data-slot="title">Title</span></div>
            <div class="team"><span data-slot="team">Team</span><small data-slot="pending">+0</small></div>
          </div>
          <div class="right"><span class="count" data-slot="counter">Counter</span><span class="digits tnum" data-slot="clock">0:00</span></div>
        </div>
        <div class="line"></div>
      </header>
      <div class="body"><span>game body</span></div>
    </div>
    <p class="legend"><b>click</b> next turn · <b>U</b> last 15s</p>
    <script src="kit.js"></script>
  </body>
</html>
