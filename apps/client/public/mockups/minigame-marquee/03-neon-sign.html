<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minigame Marquee — 03 Neon Sign (click: next turn · U: last 15s)</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* No box. The show title is a neon tube over the bar; everything else is
         type on the dark. The chrome is light, not material. */
      .sign {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem;
        padding: clamp(0.4rem, 1vh, 0.8rem) clamp(1rem, 2vw, 2rem) clamp(0.8rem, 1.4vh, 1.2rem);
        border-bottom: 2px solid rgba(251,191,36,0.55);
        box-shadow: 0 2px 0 rgba(251,191,36,0.25), 0 14px 28px -14px rgba(251,191,36,0.55);
      }
      .team {
        font-family: "Anton", sans-serif; text-transform: uppercase; letter-spacing: 0.06em;
        font-size: clamp(1.6rem, 2.6vw, 2.9rem); color: #fff;
        text-shadow: 0 0 8px rgba(255,255,255,0.45), 0 0 22px rgba(255,255,255,0.15);
        display: flex; align-items: baseline; gap: 0.6em;
      }
      .team small {
        font-family: ui-monospace, monospace; font-size: 0.5em; font-weight: 800; color: var(--gold);
        text-shadow: 0 0 8px var(--gold), 0 0 20px rgba(251,191,36,0.5);
      }
      .tube {
        font-family: "Monoton", cursive; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em;
        font-size: clamp(1.6rem, 2.8vw, 3.2rem); color: #fff3c4; white-space: nowrap;
        text-shadow: 0 0 6px #fff, 0 0 14px var(--gold), 0 0 34px var(--gold), 0 0 70px rgba(251,191,36,0.6);
      }
      .tube em { font-style: normal; animation: flick 4.2s steps(1) infinite; }
      @keyframes flick { 0%,93%,100% { opacity: 1; } 94%,96% { opacity: 0.35; } 95%,97% { opacity: 1; } 98% { opacity: 0.55; } }
      .meta { display: flex; justify-content: flex-end; align-items: center; gap: clamp(1rem, 2vw, 2rem); }
      .count { color: var(--muted); font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; font-size: clamp(0.7rem, 1vw, 1.1rem); }
      .clock {
        font-family: ui-monospace, monospace; font-weight: 800; font-size: clamp(1.7rem, 2.7vw, 3rem); color: #ffd6c7;
        border: 3px solid var(--primary); border-radius: 999px; padding: 0.05em 0.6em; letter-spacing: -0.02em;
        text-shadow: 0 0 6px #fff, 0 0 16px var(--primary), 0 0 36px var(--primary);
        box-shadow: 0 0 10px var(--primary), inset 0 0 10px rgba(249,115,22,0.6);
      }
      body.urgent .clock {
        border-color: var(--heat); color: #ffdada; animation: heatpulse 0.65s ease-in-out infinite;
        text-shadow: 0 0 6px #fff, 0 0 16px var(--heat), 0 0 36px var(--heat);
        box-shadow: 0 0 14px var(--heat), inset 0 0 12px rgba(239,68,68,0.7);
      }
      body.timeup .clock { font-size: clamp(0.9rem, 1.3vw, 1.4rem); letter-spacing: 0.16em; padding-block: 0.6em; border-color: var(--heat); }
    </style>
  </head>
  <body>
    <div class="stage">
      <header class="sign">
        <div class="team"><span data-slot="team">Team</span><small data-slot="pending">+0</small></div>
        <div class="tube" id="tube"><span data-slot="title">Title</span></div>
        <div class="meta"><span class="count" data-slot="counter">Counter</span><span class="clock tnum" data-slot="clock">0:00</span></div>
      </header>
      <div class="body"><span>game body</span></div>
    </div>
    <p class="legend"><b>click</b> next turn · <b>U</b> last 15s</p>
    <script src="kit.js"></script>
    <script>
      // One letter of the tube flickers, like a real sign with a tired transformer.
      document.addEventListener("scenario", (e) => {
        const t = e.detail.title, i = Math.max(1, Math.floor(t.length * 0.6));
        document.getElementById("tube").innerHTML = `${t.slice(0, i)}<em>${t[i]}</em>${t.slice(i + 1)}`;
      });
      document.dispatchEvent(new CustomEvent("scenario", { detail: { title: document.querySelector("[data-slot=title]").textContent } }));
    </script>
  </body>
</html>
