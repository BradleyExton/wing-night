<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minigame Marquee — 08 Neon Sign, Burning (click: next turn · U: last 15s)</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* 03 as built, except the gold rule under the sign is now the clock: a
         tube that burns down from the right. The digits shrink to a footnote. */
      .sign { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem; padding: clamp(0.4rem, 1vh, 0.8rem) clamp(1rem, 2vw, 2rem) clamp(1rem, 1.8vh, 1.5rem); }
      .team { font-family: "Anton", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; font-size: clamp(1.6rem, 2.6vw, 2.9rem); color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.45), 0 0 22px rgba(255,255,255,0.15); display: flex; align-items: baseline; gap: 0.6em; }
      .team small { font-family: ui-monospace, monospace; font-size: 0.5em; font-weight: 800; color: var(--gold); text-shadow: 0 0 8px var(--gold), 0 0 20px rgba(251,191,36,0.5); }
      .tube { font-family: "Monoton", cursive; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; font-size: clamp(1.6rem, 2.8vw, 3.2rem); color: #fff3c4; white-space: nowrap; text-shadow: 0 0 6px #fff, 0 0 14px var(--gold), 0 0 34px var(--gold), 0 0 70px rgba(251,191,36,0.6); }
      .tube em { font-style: normal; animation: flick 4.2s steps(1) infinite; }
      @keyframes flick { 0%,93%,100% { opacity: 1; } 94%,96% { opacity: 0.35; } 95%,97% { opacity: 1; } 98% { opacity: 0.55; } }
      .meta { display: flex; justify-content: flex-end; align-items: baseline; gap: clamp(1rem, 2vw, 2rem); }
      .count { color: var(--muted); font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; font-size: clamp(0.7rem, 1vw, 1.1rem); }
      .digits { font-family: ui-monospace, monospace; font-weight: 800; font-size: clamp(1.3rem, 2vw, 2.3rem); color: #ffd6c7; letter-spacing: -0.02em; text-shadow: 0 0 6px #fff, 0 0 14px var(--primary), 0 0 30px var(--primary); }
      /* the rule that was gold glass is the burning tube */
      .line { position: absolute; left: clamp(1rem, 2vw, 2rem); right: clamp(1rem, 2vw, 2rem); bottom: 0; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.06); }
      .line::before { content: ""; position: absolute; inset: 0; width: calc(var(--remaining) * 100%); border-radius: inherit; background: linear-gradient(90deg, var(--heat), var(--primary) 30%, #ffe08a); box-shadow: 0 0 8px var(--primary), 0 0 20px var(--primary), 0 0 40px rgba(249,115,22,0.5); transition: width 1s linear; }
      .line::after { content: ""; position: absolute; top: -3px; bottom: -3px; width: 6px; border-radius: 3px; background: #fff; left: calc(var(--remaining) * 100% - 3px); box-shadow: 0 0 10px #fff, 0 0 24px #fff, 0 0 36px var(--primary); transition: left 1s linear; }
      body.urgent .digits { color: #ffdada; animation: heatpulse 0.65s ease-in-out infinite; text-shadow: 0 0 6px #fff, 0 0 16px var(--heat), 0 0 36px var(--heat); }
      body.urgent .line::before { background: var(--heat); box-shadow: 0 0 10px var(--heat), 0 0 30px var(--heat); animation: heatpulse 0.65s ease-in-out infinite; }
      body.timeup .digits { font-size: clamp(0.8rem, 1.2vw, 1.3rem); letter-spacing: 0.16em; }
      body.timeup .line::after { display: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <header class="sign">
        <div class="team"><span data-slot="team">Team</span><small data-slot="pending">+0</small></div>
        <div class="tube" id="tube"><span data-slot="title">Title</span></div>
        <div class="meta"><span class="count" data-slot="counter">Counter</span><span class="digits tnum" data-slot="clock">0:00</span></div>
        <div class="line"></div>
      </header>
      <div class="body"><span>game body</span></div>
    </div>
    <p class="legend"><b>click</b> next turn · <b>U</b> last 15s</p>
    <script src="kit.js"></script>
    <script>
      const flicker = (t) => { const i = Math.max(1, Math.floor(t.length * 0.6)); document.getElementById("tube").innerHTML = `${t.slice(0, i)}<em>${t[i]}</em>${t.slice(i + 1)}`; };
      document.addEventListener("scenario", (e) => flicker(e.detail.title));
      flicker(SCENARIOS[0].title);
    </script>
  </body>
</html>
