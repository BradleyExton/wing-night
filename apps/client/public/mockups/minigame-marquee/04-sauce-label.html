<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minigame Marquee — 04 Sauce Label (click: next turn · U: last 15s)</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* A hot-sauce bottle label. Paper, print, a wax seal for the clock and
         chilies for the counter. The one direction that is not dark. */
      .label {
        position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5rem;
        background: #f3e6c8 radial-gradient(circle at 20% 0%, rgba(255,255,255,0.6), transparent 40%);
        color: #3a1d09; border-radius: 14px; padding: clamp(0.7rem, 1.3vh, 1.2rem) clamp(1.6rem, 2.6vw, 2.6rem);
        box-shadow: 0 12px 30px rgba(0,0,0,0.6), inset 0 0 0 3px #3a1d09, inset 0 0 0 6px #f3e6c8, inset 0 0 0 7px #a86a2c;
        /* ticket-punch edges */
        -webkit-mask: radial-gradient(circle at 0 50%, transparent 9px, #000 9.5px) left / 51% 100% no-repeat,
                      radial-gradient(circle at 100% 50%, transparent 9px, #000 9.5px) right / 51% 100% no-repeat;
      }
      .brand { display: flex; flex-direction: column; line-height: 1; gap: 0.25em; }
      .brand .est { font-size: clamp(0.55rem, 0.8vw, 0.85rem); font-weight: 800; letter-spacing: 0.34em; text-transform: uppercase; color: #a86a2c; }
      .brand .team { font-family: "Playfair Display", serif; font-weight: 900; font-size: clamp(1.6rem, 2.6vw, 2.9rem); letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5em; }
      .stamp {
        font-family: ui-monospace, monospace; font-size: 0.42em; font-weight: 900; color: var(--heat);
        border: 3px double var(--heat); border-radius: 6px; padding: 0.15em 0.5em; transform: rotate(-7deg); letter-spacing: 0.06em; opacity: 0.85;
      }
      .title { text-align: center; line-height: 1; }
      .title b { display: block; font-family: "Rye", serif; font-weight: 400; font-size: clamp(1.6rem, 2.7vw, 3rem); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
      .title .ribbon {
        display: inline-block; margin-top: 0.35em; background: var(--heat); color: #fff; font-weight: 900; font-size: clamp(0.55rem, 0.8vw, 0.85rem);
        letter-spacing: 0.3em; text-transform: uppercase; padding: 0.25em 1em; clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%);
      }
      .meta { display: flex; justify-content: flex-end; align-items: center; gap: clamp(1rem, 2vw, 2rem); }
      .heat { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2em; font-weight: 900; font-size: clamp(0.55rem, 0.8vw, 0.85rem); letter-spacing: 0.26em; text-transform: uppercase; color: #a86a2c; }
      .heat .chilis { font-size: clamp(1rem, 1.6vw, 1.8rem); letter-spacing: 0.1em; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.2)); }
      .heat .chilis i { font-style: normal; opacity: 0.22; filter: grayscale(1); }
      .heat .chilis i.on { opacity: 1; filter: none; }
      .seal {
        width: clamp(3.4rem, 5.4vw, 6rem); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
        background: radial-gradient(circle at 35% 30%, #ff6b6b, var(--heat) 45%, #8f1d1d 100%);
        box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 0 0 4px rgba(255,255,255,0.12), inset 0 0 0 7px rgba(0,0,0,0.12);
        color: #fff; font-family: ui-monospace, monospace; font-weight: 900; font-size: clamp(0.95rem, 1.5vw, 1.7rem); letter-spacing: -0.03em;
        transform: rotate(-6deg);
      }
      body.urgent .seal { animation: heatpulse 0.65s ease-in-out infinite; }
      body.timeup .seal { font-size: clamp(0.45rem, 0.7vw, 0.8rem); letter-spacing: 0.08em; text-align: center; line-height: 1.1; }
    </style>
  </head>
  <body>
    <div class="stage">
      <header class="label">
        <div class="brand">
          <span class="est">Wing Night · Now Serving</span>
          <span class="team"><span data-slot="team">Team</span><span class="stamp" data-slot="pending">+0</span></span>
        </div>
        <div class="title"><b data-slot="title">Title</b><span class="ribbon">Extra Hot</span></div>
        <div class="meta">
          <div class="heat" id="heat"><span class="chilis" id="chilis"></span><span data-slot="counter">Counter</span></div>
          <div class="seal tnum" data-slot="clock" data-timeup="TIME'S UP">0:00</div>
        </div>
      </header>
      <div class="body"><span>game body</span></div>
    </div>
    <p class="legend"><b>click</b> next turn · <b>U</b> last 15s</p>
    <script src="kit.js"></script>
    <script>
      // The counter is a heat rating: one chili per item, lit up to the current one.
      const paintChilis = (s) => {
        const el = document.getElementById("chilis");
        document.getElementById("heat").hidden = s.counter === null;
        el.innerHTML = s.counter === null ? "" : Array.from({ length: s.counterOf }, (_, i) => `<i class="${i < s.counterN ? "on" : ""}">🌶</i>`).join("");
      };
      document.addEventListener("scenario", (e) => paintChilis(e.detail));
      paintChilis(SCENARIOS[0]);
    </script>
  </body>
</html>
