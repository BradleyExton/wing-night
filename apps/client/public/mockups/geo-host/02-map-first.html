<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geo Host — 02 Map First (click to toggle submitted)</title>
    <style>
      :root {
        --bg: #121212; --surface: #1c1c1c; --surface-alt: #242424;
        --text: #ffffff; --muted: #a3a3a3; --primary: #f97316;
        --success: #22c55e; --gold: #fbbf24;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100dvh; overflow: hidden; background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none; cursor: pointer;
      }
      /* The map is the tablet. Everything else floats on it, so the thing a
         player actually works in gets the whole 1024x768. */
      .canvas { position: relative; height: 100dvh; overflow: hidden; isolation: isolate; }
      /* The z=2 world is square. It is sized to COVER its box and centred, so the
         map crops at the edges instead of stretching — a stretched Mercator puts
         the pins in the wrong place. Pins are percentages of this square. */
      .world { position: absolute; left: 0; top: 50%; width: 100%; aspect-ratio: 1; transform: translateY(-50%); }
      .tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.92) saturate(0.45); }
      .tiles img { width: 100%; height: 100%; min-width: 0; min-height: 0; display: block; }
      .pin { position: absolute; width: 20px; aspect-ratio: 1; border-radius: 999px; transform: translate(-50%, -50%); background: var(--primary); box-shadow: 0 0 0 5px rgba(249,115,22,0.28), 0 0 22px rgba(249,115,22,0.72); z-index: 2; }
      .pin.answer { background: var(--success); box-shadow: 0 0 0 5px rgba(34,197,94,0.28), 0 0 22px rgba(34,197,94,0.72); opacity: 0; }
      body.submitted .pin.answer { opacity: 1; }
      .link { position: absolute; inset: 0; z-index: 2; opacity: 0; transition: opacity 260ms ease; }
      body.submitted .link { opacity: 1; }

      /* Mini-rail floats as one glass strip (§2.0A), clear of the timer chip. */
      .rail {
        position: absolute; top: 0.85rem; left: 0.85rem; z-index: 5;
        display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        max-width: calc(100% - 15rem);
      }
      .chip {
        display: inline-flex; align-items: center; gap: 0.55rem;
        border: 1px solid rgba(255,255,255,0.12); background: rgba(18,18,18,0.86);
        backdrop-filter: blur(8px); border-radius: 999px; padding: 0.4rem 0.95rem;
        font-size: 0.78rem; font-weight: 700; color: var(--muted);
      }
      .chip b { color: var(--text); font-weight: 800; }
      .chip .dot { width: 0.6rem; aspect-ratio: 1; border-radius: 999px; background: var(--primary); }
      .chip.team { border-color: rgba(249,115,22,0.38); background: rgba(249,115,22,0.16); color: var(--text); }

      .views { position: absolute; top: 0.85rem; right: 0.85rem; z-index: 5; display: flex; gap: 0.4rem; }
      .views button {
        border: 1px solid rgba(255,255,255,0.14); background: rgba(18,18,18,0.86); backdrop-filter: blur(8px);
        color: var(--text); border-radius: 10px; padding: 0.5rem 0.95rem; cursor: pointer;
        font: inherit; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em;
      }
      .views button.on { border-color: rgba(249,115,22,0.5); background: rgba(249,115,22,0.2); color: var(--primary); }

      /* The photo is a floating card, not a column — it can shrink out of the
         way once the team has looked at it. */
      .plate {
        position: absolute; left: 0.85rem; top: 4.1rem; z-index: 4;
        width: clamp(14rem, 26vw, 20rem); border-radius: 18px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.14);
        background: linear-gradient(160deg, var(--surface-alt), var(--surface));
        box-shadow: 0 22px 50px rgba(0,0,0,0.7);
        transition: width 260ms ease, opacity 260ms ease;
      }
      body.shrunk .plate { width: 7rem; opacity: 0.85; }
      .plate .shot { position: relative; aspect-ratio: 4 / 3; }
      .plate .photo {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at 36% 28%, rgba(255,214,150,0.30) 0%, transparent 52%),
          linear-gradient(170deg, #4a3423 0%, #2b1d16 46%, #17110e 100%);
      }
      .plate .photo::after { content: "PARTY PHOTO"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,0.16); font-weight: 900; letter-spacing: 0.32em; font-size: 0.62rem; }
      .plate .edge { position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); }
      .plate .cap { padding: 0.7rem 0.85rem 0.85rem; }
      body.shrunk .plate .cap { display: none; }
      .plate .cap .t { font-size: 1.05rem; font-weight: 800; line-height: 1.15; }
      .plate .cap .h { margin-top: 0.2rem; color: var(--muted); font-size: 0.85rem; line-height: 1.3; }

      /* The turn's one action, bottom-left — clear of the corner dock's gutter. */
      .actionbar { position: absolute; left: 0.85rem; bottom: 0.85rem; z-index: 5; display: flex; align-items: center; gap: 0.75rem; max-width: calc(100% - 6rem); }
      .cta {
        min-height: 3.6rem; border: 0; border-radius: 16px; padding: 0 clamp(1.4rem, 3vw, 2.4rem);
        background: var(--primary); color: #1a0f04; cursor: pointer; font: inherit;
        font-size: 1.05rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em;
        box-shadow: 0 12px 28px rgba(249,115,22,0.3);
      }
      .cta.secondary { background: rgba(28,28,28,0.9); backdrop-filter: blur(8px); color: var(--text); border: 1px solid rgba(255,255,255,0.14); box-shadow: none; display: none; }
      body.submitted .cta.primary-cta { display: none; }
      body.submitted .cta.secondary { display: inline-flex; align-items: center; }
      .note { color: rgba(255,255,255,0.72); font-size: 0.82rem; background: rgba(18,18,18,0.72); backdrop-filter: blur(6px); border-radius: 10px; padding: 0.45rem 0.8rem; }
      body.submitted .note { display: none; }

      /* Verdict floats bottom-right-ish, above the dock's gutter. */
      .verdict { position: absolute; right: 0.85rem; bottom: 5.4rem; z-index: 5; display: none; gap: 0.7rem; }
      body.submitted .verdict { display: grid; grid-auto-flow: column; }
      .tile { border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(18,18,18,0.88); backdrop-filter: blur(8px); padding: 0.75rem 1.1rem; min-width: 8.5rem; text-align: right; }
      .tile .lbl { font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.24em; color: var(--muted); }
      .tile .val { margin-top: 0.25rem; font-family: ui-monospace, monospace; font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
      .tile .val small { font-size: 0.42em; color: var(--muted); margin-left: 0.3em; }
      .tile.points { border-color: rgba(249,115,22,0.4); background: linear-gradient(160deg, rgba(249,115,22,0.22), rgba(249,115,22,0.07)); }
      .tile.points .val { color: var(--primary); }

      .dock { position: fixed; right: 1.1rem; bottom: 1.1rem; width: 3.4rem; aspect-ratio: 1; border-radius: 999px; background: var(--surface-alt); border: 1px solid rgba(255,255,255,0.14); display: grid; place-items: center; color: var(--muted); font-size: 1.2rem; z-index: 9; }
    </style>
  </head>
  <body onclick="document.body.classList.toggle('submitted')">
    <div class="canvas">
      <div class="world">
  <div class="tiles">
          <img src="https://tile.openstreetmap.org/2/0/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/0.png" alt="" />
          <img src="https://tile.openstreetmap.org/2/0/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/1.png" alt="" />
          <img src="https://tile.openstreetmap.org/2/0/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/2.png" alt="" />
          <img src="https://tile.openstreetmap.org/2/0/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/3.png" alt="" />
        </div>
        <svg class="link" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="50.7" y1="34.4" x2="27.8" y2="36.2" stroke="#a3a3a3" stroke-width="0.4" stroke-dasharray="1.6 1.6" vector-effect="non-scaling-stroke" />
        </svg>
        <span class="pin" style="left:50.7%; top:34.4%"></span>
        <span class="pin answer" style="left:27.8%; top:36.2%"></span>
        </div>
        <div class="rail">
        <span class="chip"><b>R3</b>&nbsp;Scorpion Sting</span>
        <span class="chip">Geo</span>
        <span class="chip team"><span class="dot"></span>Molten Metal</span>
        <span class="chip">Photo&nbsp;<b>1</b>&nbsp;/ 2</span>
      </div>

      <div class="views"><button class="on" type="button">World</button><button type="button">Barrie</button></div>

      <div class="plate">
        <div class="shot"><div class="photo"></div><div class="edge"></div></div>
        <div class="cap">
          <div class="t">Wings and Robes</div>
          <div class="h">“Long before there was a scoreboard”</div>
        </div>
      </div>

      <div class="actionbar">
        <button class="cta primary-cta" type="button">Drop the pin</button>
        <button class="cta secondary" type="button">Next photo</button>
        <span class="note">Tap the map to place your pin. Tap again to move it.</span>
      </div>

      <div class="verdict">
        <div class="tile"><div class="lbl">Off by</div><div class="val">5,904<small>km</small></div></div>
        <div class="tile points"><div class="lbl">Points</div><div class="val">+180</div></div>
      </div>
    </div>
    <div class="dock">⋯</div>
  </body>
</html>
