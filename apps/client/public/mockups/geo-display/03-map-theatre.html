<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geo Display — 03 Map Theatre (click to toggle reveal)</title>
    <style>
      :root {
        --bg: #121212; --surface: #1c1c1c; --surface-alt: #242424;
        --text: #ffffff; --muted: #a3a3a3; --primary: #f97316;
        --success: #22c55e; --gold: #fbbf24;
        --teamA: #f97316; --teamB: #06b6d4; --teamC: #d9dee6; --teamD: #ec4899;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100dvh; overflow: hidden; background: #050505;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none; cursor: pointer;
      }
      .stage { position: relative; height: 100dvh; display: grid; grid-template-rows: 1fr auto; }
      .scene { position: relative; min-height: 0; overflow: hidden; }

      /* The dark map is the stage for the WHOLE turn — the room watches the pin land. */
      /* The z=2 world is square. It is sized to COVER its box and centred, so the
         map crops at the edges instead of stretching — a stretched Mercator puts
         the pins in the wrong place. Pins are percentages of this square. */
      .world { position: absolute; left: 0; top: 50%; width: 100%; aspect-ratio: 1; transform: translateY(-50%); }
      .tiles {
        position: absolute; inset: 0; display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr));
        filter: invert(1) hue-rotate(180deg) brightness(0.86) contrast(0.92) saturate(0.45);
      }
      .tiles img { width: 100%; height: 100%; min-width: 0; min-height: 0; display: block; }
      .scene .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.72) 100%),
          linear-gradient(180deg, rgba(5,3,2,0.8) 0%, transparent 22%);
      }
      .link { position: absolute; inset: 0; opacity: 0; transition: opacity 320ms ease; }
      body.revealed .link { opacity: 1; }
      .pin { position: absolute; z-index: 2; width: clamp(16px, 1.5vw, 26px); aspect-ratio: 1; border-radius: 999px; transform: translate(-50%, -50%); }
      .pin.guess { background: var(--primary); box-shadow: 0 0 0 5px rgba(249,115,22,0.28), 0 0 28px rgba(249,115,22,0.75); }
      .pin.guess::after {
        content: ""; position: absolute; inset: -14px; border-radius: 999px;
        border: 2px solid rgba(249,115,22,0.6); animation: ping 1.8s ease-out infinite;
      }
      @keyframes ping { to { transform: scale(1.9); opacity: 0; } }
      .pin.answer { background: var(--success); box-shadow: 0 0 0 5px rgba(34,197,94,0.28), 0 0 28px rgba(34,197,94,0.75); opacity: 0; transition: opacity 320ms ease 120ms; }
      body.revealed .pin.answer { opacity: 1; }
      body.revealed .pin.guess::after { display: none; }

      /* The photo is a card ON the map — always visible, never the stage. */
      .plate {
        position: absolute; left: clamp(1rem, 2.4vw, 2.6rem); bottom: clamp(1rem, 2.4vh, 2.6rem);
        width: clamp(17rem, 30vw, 34rem); aspect-ratio: 4 / 3; z-index: 3;
        border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.14);
        background: linear-gradient(160deg, var(--surface-alt), var(--surface));
        box-shadow: 0 26px 60px rgba(0,0,0,0.75);
      }
      .plate .photo {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at 36% 28%, rgba(255,214,150,0.32) 0%, transparent 52%),
          radial-gradient(ellipse at 74% 72%, rgba(255,120,40,0.18) 0%, transparent 58%),
          linear-gradient(170deg, #4a3423 0%, #2b1d16 46%, #17110e 100%);
      }
      .plate .photo::after {
        content: "PARTY PHOTO"; position: absolute; inset: 0; display: grid; place-items: center;
        color: rgba(255,255,255,0.16); font-weight: 900; letter-spacing: 0.4em;
        font-size: clamp(0.65rem, 0.95vw, 0.95rem);
      }
      .plate .edge { position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); }
      .plate .cap {
        position: absolute; inset: auto 0 0; padding: clamp(0.7rem, 1.2vw, 1.2rem);
        background: linear-gradient(0deg, rgba(5,3,2,0.94) 40%, transparent 100%);
      }
      .plate .cap .t { font-size: clamp(1rem, 1.7vw, 1.8rem); font-weight: 800; line-height: 1.1; }
      .plate .cap .h { margin-top: 0.2rem; color: var(--muted); font-size: clamp(0.75rem, 1.1vw, 1.15rem); }

      .marquee {
        position: absolute; top: clamp(0.8rem, 1.4vw, 1.6rem);
        left: clamp(0.8rem, 1.4vw, 1.6rem); right: clamp(0.8rem, 1.4vw, 1.6rem);
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5rem;
        background: linear-gradient(180deg, rgba(58,29,9,0.94) 0%, rgba(26,12,4,0.94) 100%);
        border: 2px solid var(--gold); border-radius: 16px;
        padding: clamp(0.7rem, 1.2vh, 1.1rem) clamp(1.4rem, 2.4vw, 2.4rem);
        box-shadow: inset 0 0 36px rgba(251,191,36,0.2), 0 8px 24px rgba(0,0,0,0.6);
        backdrop-filter: blur(6px); z-index: 4;
      }
      .marquee .bulbs { position: absolute; inset: 7px; border-radius: 12px; border: 4px dotted rgba(251,191,36,0.45); pointer-events: none; }
      .team .name { font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; font-size: clamp(1.1rem, 1.9vw, 2rem); }
      .team .pts { margin-left: 0.8rem; color: var(--gold); font-family: ui-monospace, monospace; font-weight: 800; font-size: clamp(0.9rem, 1.3vw, 1.4rem); }
      .show-title { text-align: center; text-transform: uppercase; letter-spacing: 0.34em; color: var(--gold); font-weight: 800; font-size: clamp(0.8rem, 1.2vw, 1.3rem); }
      .meta { display: flex; justify-content: flex-end; padding-right: clamp(8rem, 14vw, 18rem); font-size: clamp(0.72rem, 1vw, 1.05rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.28em; color: var(--muted); }
      .meta b { color: var(--text); }

      /* Live status, then the verdict, in the same top-right slot. */
      .readout {
        position: absolute; right: clamp(1rem, 2.4vw, 2.6rem); top: clamp(5.5rem, 9vh, 8rem);
        z-index: 3; display: flex; flex-direction: column; align-items: flex-end; gap: clamp(0.6rem, 1.1vh, 1rem);
      }
      .status { display: inline-flex; align-items: center; gap: 0.7rem; border: 1px solid rgba(249,115,22,0.35); background: rgba(18,18,18,0.82); backdrop-filter: blur(8px); border-radius: 999px; padding: 0.45rem 1.2rem; font-size: clamp(0.7rem, 1.05vw, 1.1rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.18em; }
      .status .dot { width: 0.6em; aspect-ratio: 1; border-radius: 999px; background: var(--primary); animation: blip 1.6s ease-in-out infinite; }
      @keyframes blip { 50% { opacity: 0.25; } }
      body.revealed .status { display: none; }
      .tiles-row { display: none; gap: clamp(0.7rem, 1.2vw, 1.2rem); }
      body.revealed .tiles-row { display: grid; grid-auto-flow: column; }
      .tile { border-radius: 18px; border: 1px solid rgba(255,255,255,0.12); background: rgba(18,18,18,0.86); backdrop-filter: blur(8px); padding: clamp(0.7rem, 1.4vh, 1.2rem) clamp(1rem, 1.8vw, 1.6rem); min-width: clamp(8rem, 13vw, 13rem); text-align: right; }
      .tile .lbl { font-size: clamp(0.62rem, 0.9vw, 0.95rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.26em; color: var(--muted); }
      .tile .val { margin-top: 0.3rem; font-family: ui-monospace, monospace; font-weight: 800; font-size: clamp(1.5rem, 3vw, 3.2rem); line-height: 1; font-variant-numeric: tabular-nums; }
      .tile .val small { font-size: 0.42em; color: var(--muted); margin-left: 0.3em; }
      .tile.points { border-color: rgba(249,115,22,0.4); background: linear-gradient(160deg, rgba(249,115,22,0.24), rgba(249,115,22,0.08)); }
      .tile.points .val { color: var(--primary); }
      .legend { position: absolute; right: clamp(1rem, 2.4vw, 2.6rem); bottom: clamp(1rem, 2.4vh, 2.6rem); z-index: 3; display: none; gap: 1.4rem; color: var(--muted); font-size: clamp(0.7rem, 1vw, 1.05rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; }
      body.revealed .legend { display: flex; }
      .legend span { display: inline-flex; align-items: center; gap: 0.5rem; }
      .legend i { width: 0.7em; aspect-ratio: 1; border-radius: 999px; display: inline-block; }

      footer.deck { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(255,255,255,0.07); border-top: 1px solid rgba(255,255,255,0.10); position: relative; z-index: 5; }
      .bay { position: relative; background: linear-gradient(180deg, #1b1613 0%, #0c0a09 100%); padding: clamp(0.5rem, 1vh, 0.9rem) clamp(0.9rem, 1.6vw, 1.5rem); display: flex; align-items: center; justify-content: space-between; }
      .bay::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(0,0,0,0.9)); }
      .bay .nm { font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; font-size: clamp(0.85rem, 1.3vw, 1.4rem); }
      .bay .sc { font-family: ui-monospace, monospace; font-weight: 800; font-size: clamp(1rem, 1.6vw, 1.7rem); }
      .bay.a .nm { color: var(--teamA); } .bay.b .nm { color: var(--teamB); }
      .bay.c .nm { color: var(--teamC); } .bay.d .nm { color: var(--teamD); }
    </style>
  </head>
  <body onclick="document.body.classList.toggle('revealed')">
    <div class="stage">
      <div class="scene">
        <div class="world">
  <div class="tiles">
            <img src="https://tile.openstreetmap.org/2/0/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/0.png" alt="" />
            <img src="https://tile.openstreetmap.org/2/0/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/1.png" alt="" />
            <img src="https://tile.openstreetmap.org/2/0/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/2.png" alt="" />
            <img src="https://tile.openstreetmap.org/2/0/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/3.png" alt="" />
          </div>
          <svg class="link" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line x1="50.7" y1="34.4" x2="27.8" y2="36.2" stroke="#a3a3a3" stroke-width="0.4" stroke-dasharray="1.6 1.6" vector-effect="non-scaling-stroke" />
          </svg>
          <span class="pin guess" style="left:50.7%; top:34.4%"></span>
          <span class="pin answer" style="left:27.8%; top:36.2%"></span>
        </div>
        <div class="vignette"></div>

        <header class="marquee">
          <span class="bulbs"></span>
          <div class="team"><span class="name">Molten Metal</span><span class="pts">0</span></div>
          <div class="show-title">Geo</div>
          <div class="meta">Photo <b>&nbsp;1&nbsp;</b> / 2</div>
        </header>

        <div class="plate">
          <div class="photo"></div>
          <div class="edge"></div>
          <div class="cap">
            <div class="t">Wings and Robes</div>
            <div class="h">“Long before there was a scoreboard”</div>
          </div>
        </div>

        <div class="readout">
          <div class="status"><span class="dot"></span>Molten Metal is dropping a pin</div>
          <div class="tiles-row">
            <div class="tile"><div class="lbl">Off by</div><div class="val">5,904<small>km</small></div></div>
            <div class="tile points"><div class="lbl">Points</div><div class="val">+180</div></div>
          </div>
        </div>

        <div class="legend">
          <span><i style="background:var(--primary)"></i>Their pin</span>
          <span><i style="background:var(--success)"></i>Actual spot</span>
        </div>
      </div>

      <footer class="deck">
        <div class="bay a"><span class="nm">Disco Inferno</span><span class="sc">0</span></div>
        <div class="bay b"><span class="nm">Honky Tonk Heat</span><span class="sc">0</span></div>
        <div class="bay c"><span class="nm">Molten Metal</span><span class="sc">0</span></div>
        <div class="bay d"><span class="nm">Spice Girls</span><span class="sc">0</span></div>
      </footer>
    </div>
  </body>
</html>
