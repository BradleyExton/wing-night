<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geo Display — 01 Broadcast (click to toggle reveal)</title>
    <style>
      :root {
        --bg: #121212;
        --surface: #1c1c1c;
        --surface-alt: #242424;
        --text: #ffffff;
        --muted: #a3a3a3;
        --primary: #f97316;
        --heat: #ef4444;
        --success: #22c55e;
        --gold: #fbbf24;
        --teamA: #f97316;
        --teamB: #06b6d4;
        --teamC: #d9dee6;
        --teamD: #ec4899;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100dvh; overflow: hidden;
        background: radial-gradient(ellipse at top, #2a1306 0%, #0f0a08 60%, #050505 100%);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none; cursor: pointer;
      }
      .stage {
        height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
        gap: clamp(0.7rem, 1.2vh, 1.2rem);
        padding: clamp(0.8rem, 1.4vw, 1.6rem) clamp(0.8rem, 1.4vw, 1.6rem) 0;
      }

      /* Marquee — the same HUD DRAWING / EMOJI / JOUST / SCHLONIC wear (§2.5-2.9). */
      .marquee {
        position: relative; display: grid;
        grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5rem;
        background: linear-gradient(180deg, #3a1d09 0%, #1a0c04 100%);
        border: 2px solid var(--gold); border-radius: 16px;
        padding: clamp(0.8rem, 1.4vh, 1.3rem) clamp(1.4rem, 2.4vw, 2.4rem);
        box-shadow: inset 0 0 36px rgba(251,191,36,0.2), 0 8px 20px rgba(0,0,0,0.55);
      }
      .marquee .bulbs {
        position: absolute; inset: 7px; border-radius: 12px;
        border: 4px dotted rgba(251,191,36,0.45); pointer-events: none;
      }
      .team .name {
        font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em;
        font-size: clamp(1.2rem, 2vw, 2.1rem);
      }
      .team .pts {
        margin-left: 0.8rem; color: var(--gold);
        font-family: ui-monospace, monospace; font-weight: 800;
        font-size: clamp(0.95rem, 1.4vw, 1.5rem);
      }
      .show-title {
        text-align: center; text-transform: uppercase; letter-spacing: 0.34em;
        color: var(--gold); font-weight: 800; font-size: clamp(0.8rem, 1.2vw, 1.3rem);
      }
      .meta {
        display: flex; align-items: center; justify-content: flex-end;
        gap: clamp(0.9rem, 1.6vw, 1.6rem);
        /* clears the shell's absolute timer chip */
        padding-right: clamp(8rem, 14vw, 18rem);
      }
      .meta .run {
        font-size: clamp(0.72rem, 1vw, 1.05rem); font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.28em; color: var(--muted);
      }
      .meta .run b { color: var(--text); }

      main {
        display: grid; grid-template-columns: 1.15fr 1fr;
        gap: clamp(1.2rem, 2.4vw, 2.6rem); min-height: 0; align-items: stretch;
      }

      /* Plate = the house card: rounded, hairline border, surface gradient.
         No white polaroid border, no rotation, no shadow-box. */
      .plate {
        position: relative; min-height: 0; overflow: hidden;
        border-radius: 22px; border: 1px solid rgba(255,255,255,0.10);
        background: linear-gradient(160deg, var(--surface-alt), var(--surface));
        box-shadow: 0 18px 44px rgba(0,0,0,0.55);
      }
      .plate .photo {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at 34% 28%, rgba(255,214,150,0.30) 0%, transparent 52%),
          radial-gradient(ellipse at 74% 72%, rgba(255,120,40,0.16) 0%, transparent 58%),
          linear-gradient(170deg, #4a3423 0%, #2b1d16 46%, #17110e 100%);
      }
      .plate .photo::after {
        content: "PARTY PHOTO"; position: absolute; inset: 0;
        display: grid; place-items: center;
        color: rgba(255,255,255,0.16); font-weight: 900;
        letter-spacing: 0.4em; font-size: clamp(0.7rem, 1.1vw, 1.1rem);
      }
      .plate .scrim {
        position: absolute; inset: 0;
        background: linear-gradient(0deg, rgba(5,3,2,0.86) 0%, transparent 42%);
      }
      /* One primary hairline along the top edge — the house "this is live" mark. */
      .plate .edge {
        position: absolute; inset: 0 0 auto; height: 3px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
      }

      /* Map: real OSM tiles, inverted to the show's dark palette. */
      .map { position: absolute; inset: 0; opacity: 0; transition: opacity 260ms ease; }
      body.revealed .map { opacity: 1; }
      body.revealed .plate .photo,
      body.revealed .plate .scrim { opacity: 0.08; }
      /* The z=2 world is square. It is sized to COVER its box and centred, so the
         map crops at the edges instead of stretching — a stretched Mercator puts
         the pins in the wrong place. Pins are percentages of this square. */
      .world { position: absolute; left: 0; top: 50%; width: 100%; aspect-ratio: 1; transform: translateY(-50%); }
      .tiles {
        position: absolute; inset: 0;
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr));
        filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9) saturate(0.5);
      }
      .tiles img { width: 100%; height: 100%; min-width: 0; min-height: 0; display: block; }
      .pin {
        position: absolute; width: clamp(14px, 1.3vw, 22px); aspect-ratio: 1;
        border-radius: 999px; transform: translate(-50%, -50%);
      }
      .pin.guess { background: var(--primary); box-shadow: 0 0 0 4px rgba(249,115,22,0.30), 0 0 22px rgba(249,115,22,0.7); }
      .pin.answer { background: var(--success); box-shadow: 0 0 0 4px rgba(34,197,94,0.30), 0 0 22px rgba(34,197,94,0.7); }
      .link { position: absolute; inset: 0; }

      .notes { display: flex; flex-direction: column; justify-content: center; gap: clamp(0.7rem, 1.4vh, 1.3rem); min-width: 0; }
      .eyebrow {
        font-size: clamp(0.7rem, 1vw, 1.05rem); font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.3em; color: var(--primary);
      }
      .title {
        margin: 0; font-size: clamp(2rem, 4.4vw, 4.6rem); font-weight: 800;
        line-height: 1.04; letter-spacing: -0.01em; text-wrap: balance;
      }
      .hint {
        margin: 0; color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.9rem);
        line-height: 1.35; max-width: 22ch;
      }
      .status {
        display: inline-flex; align-items: center; gap: 0.75rem; align-self: flex-start;
        border: 1px solid rgba(249,115,22,0.3); background: rgba(249,115,22,0.10);
        border-radius: 999px; padding: 0.45rem 1.2rem;
        font-size: clamp(0.72rem, 1.1vw, 1.15rem); font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.18em;
      }
      .status .dot {
        width: 0.6em; aspect-ratio: 1; border-radius: 999px; background: var(--primary);
        animation: blip 1.6s ease-in-out infinite;
      }
      @keyframes blip { 50% { opacity: 0.25; } }

      /* Reveal stats are house stat tiles — not rotated rubber stamps. */
      .tiles-row { display: none; gap: clamp(0.8rem, 1.4vw, 1.4rem); }
      body.revealed .tiles-row { display: grid; grid-template-columns: 1fr 1fr; }
      body.revealed .hint, body.revealed .status { display: none; }
      .tile {
        border-radius: 18px; border: 1px solid rgba(255,255,255,0.10);
        background: linear-gradient(160deg, var(--surface-alt), var(--surface));
        padding: clamp(0.8rem, 1.6vh, 1.4rem) clamp(1rem, 1.8vw, 1.6rem);
      }
      .tile .lbl {
        font-size: clamp(0.62rem, 0.9vw, 0.95rem); font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.26em; color: var(--muted);
      }
      .tile .val {
        margin-top: 0.35rem; font-family: ui-monospace, monospace; font-weight: 800;
        font-size: clamp(1.6rem, 3.2vw, 3.4rem); line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .tile .val small { font-size: 0.42em; letter-spacing: 0.1em; color: var(--muted); margin-left: 0.3em; }
      .tile.points { border-color: rgba(249,115,22,0.35); background: linear-gradient(160deg, rgba(249,115,22,0.16), rgba(249,115,22,0.04)); }
      .tile.points .val { color: var(--primary); }
      .legend { display: none; gap: 1.4rem; color: var(--muted); font-size: clamp(0.7rem, 1vw, 1.05rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; }
      body.revealed .legend { display: flex; }
      .legend span { display: inline-flex; align-items: center; gap: 0.5rem; }
      .legend i { width: 0.7em; aspect-ratio: 1; border-radius: 999px; display: inline-block; }

      /* Deck footer (§2.2C), simplified to place the stage in context. */
      footer.deck { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(255,255,255,0.07); border-top: 1px solid rgba(255,255,255,0.10); }
      .bay { position: relative; background: linear-gradient(180deg, #1b1613 0%, #0c0a09 100%); padding: clamp(0.5rem, 1vh, 0.9rem) clamp(0.9rem, 1.6vw, 1.5rem); display: flex; align-items: center; justify-content: space-between; }
      .bay::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(0,0,0,0.9)); }
      .bay .nm { font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; font-size: clamp(0.85rem, 1.3vw, 1.4rem); }
      .bay .sc { font-family: ui-monospace, monospace; font-weight: 800; font-size: clamp(1rem, 1.6vw, 1.7rem); }
      .bay.a .nm { color: var(--teamA); } .bay.b .nm { color: var(--teamB); }
      .bay.c .nm { color: var(--teamC); } .bay.d .nm { color: var(--teamD); }
    </style>
  </head>
  <body onclick="document.body.classList.toggle('revealed')">
    <div class="stage">
      <header class="marquee">
        <span class="bulbs"></span>
        <div class="team"><span class="name">Molten Metal</span><span class="pts">0</span></div>
        <div class="show-title">Geo</div>
        <div class="meta"><span class="run">Photo <b>1</b> / 2</span></div>
      </header>

      <main>
        <div class="plate">
          <div class="photo"></div>
          <div class="scrim"></div>
          <div class="edge"></div>
          <div class="map">
            <div class="world">
  <div class="tiles">
                <img src="https://tile.openstreetmap.org/2/0/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/0.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/0.png" alt="" />
                <img src="https://tile.openstreetmap.org/2/0/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/1.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/1.png" alt="" />
                <img src="https://tile.openstreetmap.org/2/0/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/2.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/2.png" alt="" />
                <img src="https://tile.openstreetmap.org/2/0/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/1/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/2/3.png" alt="" /><img src="https://tile.openstreetmap.org/2/3/3.png" alt="" />
              </div>
              <svg class="link" viewBox="0 0 100 100" preserveAspectRatio="none">
                <line x1="50.7" y1="34.4" x2="27.8" y2="36.2" stroke="#a3a3a3" stroke-width="0.4" stroke-dasharray="1.6 1.6" vector-effect="non-scaling-stroke" />
              </svg>
              <span class="pin guess" style="left:50.7%; top:34.4%"></span>
              <span class="pin answer" style="left:27.8%; top:36.2%"></span>
        </div>
        </div>
        </div>

        <div class="notes">
          <div class="eyebrow">Where was this taken?</div>
          <h1 class="title">Wings and Robes</h1>
          <p class="hint">“Long before there was a scoreboard”</p>
          <div class="status"><span class="dot"></span>Molten Metal is dropping a pin</div>
          <div class="tiles-row">
            <div class="tile"><div class="lbl">Off by</div><div class="val">5,904<small>km</small></div></div>
            <div class="tile points"><div class="lbl">Points</div><div class="val">+180</div></div>
          </div>
          <div class="legend">
            <span><i style="background:var(--primary)"></i>Their pin</span>
            <span><i style="background:var(--success)"></i>Actual spot</span>
          </div>
        </div>
      </main>

      <footer class="deck">
        <div class="bay a"><span class="nm">Disco Inferno</span><span class="sc">0</span></div>
        <div class="bay b"><span class="nm">Honky Tonk Heat</span><span class="sc">0</span></div>
        <div class="bay c"><span class="nm">Molten Metal</span><span class="sc">0</span></div>
        <div class="bay d"><span class="nm">Spice Girls</span><span class="sc">0</span></div>
      </footer>
    </div>
  </body>
</html>
