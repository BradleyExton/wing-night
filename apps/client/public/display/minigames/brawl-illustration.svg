<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Streets of Barrie mini-game artwork">
  <defs>
    <linearGradient id="brawl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026" />
      <stop offset="62%" stop-color="#26204a" />
      <stop offset="100%" stop-color="#4a2a4f" />
    </linearGradient>
    <radialGradient id="brawl-lamp-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0" />
    </radialGradient>
    <pattern id="brawl-pavers" patternUnits="userSpaceOnUse" x="0" y="146" width="18" height="18">
      <g stroke="#2a1410" stroke-width="0.8">
        <rect width="9" height="9" fill="#5e2c22" />
        <rect x="9" width="9" height="9" fill="#47201a" />
        <rect y="9" width="9" height="9" fill="#47201a" />
        <rect x="9" y="9" width="9" height="9" fill="#5e2c22" />
      </g>
    </pattern>
  </defs>
  <rect width="240" height="180" fill="url(#brawl-sky)" />
  <circle cx="34" cy="28" r="12" fill="#f4ecd0" opacity="0.92" />
  <circle cx="29" cy="25" r="12" fill="#0e1430" opacity="0.9" />
  <g fill="#f4ecd0" opacity="0.7">
    <circle cx="80" cy="18" r="0.9" /><circle cx="122" cy="30" r="0.7" /><circle cx="168" cy="14" r="0.9" />
    <circle cx="210" cy="36" r="0.7" /><circle cx="146" cy="44" r="0.6" />
  </g>

  <!-- Dunlop's fronts after dark: brick and stucco, the windows still lit -->
  <g>
    <rect x="-4" y="70" width="52" height="66" fill="#3a2a3e" />
    <rect x="48" y="82" width="44" height="54" fill="#2f2840" />
    <rect x="92" y="62" width="58" height="74" fill="#3d2c38" />
    <rect x="150" y="78" width="46" height="58" fill="#2b2a42" />
    <rect x="196" y="68" width="48" height="68" fill="#382a3c" />
    <rect x="-4" y="66" width="52" height="4" fill="#4e3a50" />
    <rect x="92" y="58" width="58" height="4" fill="#52384a" />
    <rect x="196" y="64" width="48" height="4" fill="#4c384e" />
  </g>
  <g fill="#ffcf6b" opacity="0.8">
    <rect x="6" y="80" width="10" height="12" /><rect x="26" y="80" width="10" height="12" />
    <rect x="58" y="92" width="9" height="11" /><rect x="74" y="92" width="9" height="11" opacity="0.4" />
    <rect x="102" y="72" width="11" height="13" opacity="0.5" /><rect x="128" y="72" width="11" height="13" />
    <rect x="160" y="88" width="10" height="12" /><rect x="178" y="88" width="10" height="12" opacity="0.45" />
    <rect x="206" y="78" width="10" height="12" /><rect x="224" y="78" width="10" height="12" />
  </g>
  <!-- Shopfronts at street level, one neon sign -->
  <g>
    <rect x="4" y="108" width="36" height="28" fill="#1b1424" />
    <rect x="100" y="104" width="42" height="32" fill="#1b1424" />
    <rect x="204" y="106" width="32" height="30" fill="#1b1424" />
    <rect x="6" y="98" width="32" height="7" rx="2" fill="none" stroke="#ff4f8b" stroke-width="1.6" />
    <rect x="6" y="98" width="32" height="7" rx="2" fill="#ff4f8b" opacity="0.18" />
  </g>

  <!-- A streetlamp, and the pool it throws where the fight is -->
  <ellipse cx="120" cy="142" rx="80" ry="16" fill="url(#brawl-lamp-pool)" />
  <rect x="178" y="70" width="2.6" height="66" fill="#1c2230" />
  <path d="M 179 72 Q 179 64 170 64 L 164 64" fill="none" stroke="#1c2230" stroke-width="2.4" />
  <rect x="159" y="63" width="9" height="3.6" rx="1.4" fill="#ffe7a8" />

  <!-- The sidewalk and the pavers -->
  <rect x="0" y="136" width="240" height="10" fill="#6b6672" />
  <rect x="0" y="146" width="240" height="18" fill="url(#brawl-pavers)" />
  <rect x="0" y="164" width="240" height="16" fill="#1e1218" />
  <line x1="0" y1="136" x2="240" y2="136" stroke="#a7a1ad" stroke-width="2" />

  <!-- The hen, squared up: the cast bird facing right, beak open for the peck -->
  <g transform="translate(78 134)">
    <ellipse cx="0" cy="2" rx="18" ry="3" fill="#000000" opacity="0.35" />
    <path d="M -6 -16 L -9 -1 M 6 -16 L 8 -1" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" />
    <path d="M -13 -1 L -6 -1 M 5 -1 L 12 -1" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <g transform="translate(0 -30) scale(0.62) translate(-40 -36)" fill="#34b86b" stroke="#0e3a22" stroke-width="2.4" stroke-linejoin="round">
      <path d="M 22 46 C 10 47 2 41 0 30 C 6 39 14 42 26 41 Z M 22 41 C 11 40 3 33 2 20 C 9 31 15 36 25 36 Z M 24 36 C 14 32 8 24 11 10 C 14 25 19 30 28 31 Z" />
      <path d="M 16 42 C 16 28 32 22 50 27 C 64 31 67 44 61 55 C 53 65 30 66 21 58 C 16 54 16 48 16 42 Z" />
      <path d="M 47 13 C 46 5 52 3 54 9 C 55 2 61 2 62 8 C 63 4 68 5 66 13 Z" fill="#e8453c" />
      <circle cx="58" cy="20" r="12" />
      <path d="M 69 17 L 81 13 L 70 20 Z" fill="#f59e0b" />
      <path d="M 69 22 L 80 25 L 69 25 Z" fill="#f59e0b" />
      <path d="M 47 35 C 38 29 24 33 20 44 C 19 49 21 53 24 55 Q 28 50 31 54 Q 35 49 38 53 Q 42 48 45 51 C 49 46 51 40 47 35 Z" />
      <circle cx="59" cy="18" r="3.2" fill="#fff7ed" stroke="none" />
      <circle cx="60" cy="18" r="1.6" fill="#1c0d02" stroke="none" />
      <path d="M 54 11 L 63 14" fill="none" stroke="#0e3a22" stroke-width="2.4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Impact lines between them -->
  <g stroke="#ffd23f" stroke-width="1.4" stroke-linecap="round">
    <path d="M 118 96 L 112 90" /><path d="M 121 94 L 121 86" /><path d="M 124 96 L 130 90" />
  </g>

  <!-- The goose, facing left: neck back, wings up, honking -->
  <g transform="translate(160 134)">
    <ellipse cx="0" cy="2" rx="20" ry="3" fill="#000000" opacity="0.35" />
    <path d="M -4 -12 L -6 -1 M 6 -12 L 7 -1" fill="none" stroke="#f08a24" stroke-width="2.4" stroke-linecap="round" />
    <path d="M -11 -1 L -3 -1 M 3 -1 L 11 -1" fill="none" stroke="#f08a24" stroke-width="2" stroke-linecap="round" />
    <g stroke="#2a2420" stroke-width="1.6" stroke-linejoin="round">
      <!-- Body -->
      <path d="M -16 -20 C -16 -32 2 -36 14 -30 C 22 -26 24 -16 16 -12 C 6 -8 -12 -10 -16 -20 Z" fill="#8a7a68" />
      <path d="M -12 -14 C -4 -10 8 -10 15 -13" fill="none" stroke="#e8e2d6" stroke-width="3" />
      <!-- Raised wing -->
      <path d="M 4 -28 C 10 -44 24 -50 30 -46 C 24 -42 22 -36 14 -28 Z" fill="#6c5e50" />
      <path d="M 10 -36 L 24 -46 M 13 -32 L 27 -42" fill="none" stroke="#4a4036" stroke-width="1" />
      <!-- Neck and head, black with the white chinstrap -->
      <path d="M -10 -26 C -14 -36 -16 -44 -12 -52 C -9 -56 -3 -55 -2 -50 C -3 -42 -2 -34 -2 -28 Z" fill="#1c1a19" />
      <ellipse cx="-9" cy="-52" rx="7" ry="5.6" fill="#1c1a19" />
      <path d="M -6 -51 C -4 -54 -2 -52 -3 -48 C -5 -47 -7 -48 -6 -51 Z" fill="#f2efe8" stroke="none" />
      <!-- Open bill: the honk -->
      <path d="M -15 -54 L -26 -58 L -15 -51 Z" fill="#2a2420" />
      <path d="M -15 -50 L -25 -48 L -15 -48 Z" fill="#2a2420" />
    </g>
    <circle cx="-11" cy="-54" r="1.4" fill="#ff5a3c" />
    <path d="M -14 -57 L -8 -55" stroke="#ff5a3c" stroke-width="1.2" stroke-linecap="round" />
    <!-- Honk marks -->
    <g fill="none" stroke="#f4ecd0" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
      <path d="M -31 -62 Q -34 -56 -31 -50" /><path d="M -36 -65 Q -40 -56 -36 -47" />
    </g>
  </g>
</svg>
