<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Schlonic mini-game artwork">
  <defs>
    <linearGradient id="schlonic-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f7fc4" />
      <stop offset="58%" stop-color="#6dc0ea" />
      <stop offset="100%" stop-color="#cfeaf7" />
    </linearGradient>
    <pattern id="schlonic-pavers" patternUnits="userSpaceOnUse" x="0" y="146" width="18" height="18">
      <g stroke="#5c2518" stroke-width="0.8">
        <rect width="9" height="9" fill="#b9523b" />
        <rect x="9" width="9" height="9" fill="#8e3a2a" />
        <rect y="9" width="9" height="9" fill="#8e3a2a" />
        <rect x="9" y="9" width="9" height="9" fill="#b9523b" />
      </g>
    </pattern>
    <pattern id="schlonic-slabs" patternUnits="userSpaceOnUse" x="4" y="0" width="22" height="180">
      <rect width="22" height="180" fill="#cdc8bd" />
      <rect width="0.8" height="180" fill="#9c968a" />
    </pattern>
    <!-- A sauced wing: an orange lobe on a pale bone, the one thing out there that is not a schlong -->
    <g id="schlonic-wing">
      <line x1="-0.6" y1="-0.6" x2="-4.7" y2="-4.7" stroke="#c9a273" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-0.6" y1="-0.6" x2="-4.7" y2="-4.7" stroke="#fff1d6" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="-5.4" cy="-4" r="1.25" fill="#fff1d6" stroke="#c9a273" stroke-width="0.5" />
      <circle cx="-4" cy="-5.4" r="1.25" fill="#fff1d6" stroke="#c9a273" stroke-width="0.5" />
      <ellipse cx="0.8" cy="0.9" rx="5.2" ry="4.3" transform="rotate(-30 0.8 0.9)" fill="#f5902b" stroke="#7a3105" stroke-width="1.1" />
      <ellipse cx="-0.6" cy="-0.6" rx="1.8" ry="1" transform="rotate(-30 -0.6 -0.6)" fill="#ffce7a" />
    </g>
  </defs>
  <rect width="240" height="180" fill="url(#schlonic-sky)" />
  <circle cx="206" cy="30" r="17" fill="#ffe066" opacity="0.9" />
  <ellipse cx="44" cy="26" rx="17" ry="7" fill="#f4fbff" opacity="0.85" />
  <ellipse cx="56" cy="22" rx="11" ry="6" fill="#f4fbff" opacity="0.85" />
  <path d="M 150 40 q 3 -2.6 6 0 q 3 -2.6 6 0" fill="none" stroke="#55433a" stroke-width="0.8" stroke-linecap="round" opacity="0.5" />

  <!-- At the bottom of the hill: the bay, and Oro's bank across it -->
  <path d="M -20 78 Q 20 68 60 78 Q 100 70 140 78 Q 180 69 220 78 L 260 84 L -20 84 Z" fill="#86aab0" opacity="0.85" />
  <rect x="0" y="78" width="240" height="16" fill="#2f8fc4" />
  <rect x="0" y="78" width="240" height="3" fill="#2b6ea6" />
  <rect x="0" y="90" width="240" height="4" fill="#63b8de" opacity="0.75" />
  <g fill="#ffffff">
    <rect x="200" y="82" width="7" height="1.2" opacity="0.4" />
    <rect x="195" y="86" width="6" height="1.2" opacity="0.3" />
    <rect x="208" y="86" width="8" height="1.2" opacity="0.3" />
  </g>
  <rect x="0" y="94" width="240" height="22" fill="#a8c8b2" />

  <!-- Downtown's slabs and the twin condos on the water, hazed -->
  <g opacity="0.82">
    <g fill="#93abc6">
      <rect x="12" y="66" width="10" height="29" />
      <rect x="25" y="54" width="9" height="41" />
      <rect x="37" y="72" width="12" height="23" />
      <rect x="52" y="81" width="24" height="14" />
      <rect x="52" y="73" width="10" height="9" />
    </g>
    <g fill="#e2f0fb" opacity="0.5">
      <rect x="14" y="70" width="6" height="2" /><rect x="14" y="76" width="6" height="2" /><rect x="14" y="82" width="6" height="2" />
      <rect x="27" y="58" width="5" height="2" /><rect x="27" y="64" width="5" height="2" /><rect x="27" y="70" width="5" height="2" /><rect x="27" y="76" width="5" height="2" />
      <rect x="39" y="76" width="8" height="2" /><rect x="39" y="82" width="8" height="2" />
    </g>
    <!-- The condos: cream towers with blue glass corners -->
    <g>
      <rect x="150" y="60" width="14" height="35" fill="#f0dcae" />
      <rect x="164" y="60" width="4" height="35" fill="#cdb17c" />
      <rect x="150" y="60" width="2.6" height="35" fill="#2b6ea6" />
      <rect x="161" y="60" width="2.6" height="35" fill="#2b6ea6" />
      <rect x="156" y="60" width="2" height="35" fill="#2b6ea6" opacity="0.7" />
      <rect x="152" y="56" width="10" height="4" fill="#f0dcae" />
      <rect x="172" y="54" width="15" height="41" fill="#f0dcae" />
      <rect x="187" y="54" width="4.4" height="41" fill="#cdb17c" />
      <rect x="172" y="54" width="2.8" height="41" fill="#2b6ea6" />
      <rect x="184" y="54" width="2.8" height="41" fill="#2b6ea6" />
      <rect x="178.5" y="54" width="2" height="41" fill="#2b6ea6" opacity="0.7" />
      <rect x="174" y="49.5" width="11" height="4.5" fill="#f0dcae" />
      <rect x="146" y="92" width="48" height="3" fill="#cdb17c" />
    </g>
  </g>

  <!-- Dunlop's fronts across the road, with a cross street down to the water between them -->
  <g>
    <rect x="-4" y="98" width="30" height="20" fill="#b88c83" />
    <rect x="26" y="102" width="26" height="16" fill="#d4cbaf" />
    <rect x="52" y="96" width="28" height="22" fill="#b88c83" />
    <rect x="-4" y="96" width="30" height="2.4" fill="#957975" />
    <rect x="52" y="94" width="28" height="2.4" fill="#957975" />
    <path d="M 26 102 L 39 97 L 52 102 Z" fill="#c1b79c" />
    <rect x="128" y="100" width="26" height="18" fill="#d4cbaf" />
    <rect x="154" y="97" width="30" height="21" fill="#b88c83" />
    <rect x="184" y="101" width="30" height="17" fill="#d4cbaf" />
    <rect x="214" y="96" width="30" height="22" fill="#b88c83" />
    <rect x="154" y="95" width="30" height="2.4" fill="#957975" />
    <rect x="214" y="94" width="30" height="2.4" fill="#957975" />
    <g fill="#6d7e88">
      <rect x="2" y="102" width="5" height="5" /><rect x="14" y="102" width="5" height="5" />
      <rect x="31" y="106" width="5" height="4" /><rect x="42" y="106" width="5" height="4" />
      <rect x="57" y="100" width="5" height="5" /><rect x="69" y="100" width="5" height="5" />
      <rect x="133" y="104" width="5" height="4" /><rect x="144" y="104" width="5" height="4" />
      <rect x="159" y="101" width="5" height="5" /><rect x="172" y="101" width="5" height="5" />
      <rect x="189" y="105" width="5" height="4" /><rect x="202" y="105" width="5" height="4" />
      <rect x="219" y="100" width="5" height="5" /><rect x="231" y="100" width="5" height="5" />
    </g>
    <g fill="#b06d6e">
      <path d="M -4 110 L 26 110 L 24 113 L -2 113 Z" />
      <path d="M 154 110 L 184 110 L 182 113 L 156 113 Z" />
    </g>
    <g fill="#659b7e">
      <path d="M 52 110 L 80 110 L 78 113 L 54 113 Z" />
      <path d="M 214 110 L 244 110 L 242 113 L 216 113 Z" />
    </g>
  </g>

  <!-- The road between the two sidewalks, and its centre line -->
  <rect x="0" y="118" width="240" height="3" fill="#c9ccc6" />
  <rect x="0" y="121" width="240" height="17" fill="#5b6068" />
  <g fill="#f2c94c" opacity="0.85">
    <rect x="4" y="127" width="12" height="1.4" /><rect x="28" y="127" width="12" height="1.4" /><rect x="52" y="127" width="12" height="1.4" />
    <rect x="76" y="127" width="12" height="1.4" /><rect x="100" y="127" width="12" height="1.4" /><rect x="124" y="127" width="12" height="1.4" />
    <rect x="148" y="127" width="12" height="1.4" /><rect x="172" y="127" width="12" height="1.4" /><rect x="196" y="127" width="12" height="1.4" />
    <rect x="220" y="127" width="12" height="1.4" />
  </g>

  <!-- The near sidewalk the hen skates: concrete slabs over the red-brick paver checker -->
  <rect x="0" y="136" width="240" height="10" fill="url(#schlonic-slabs)" />
  <rect x="0" y="146" width="240" height="18" fill="url(#schlonic-pavers)" />
  <rect x="0" y="146" width="240" height="18" fill="none" stroke="#5c2518" stroke-width="1" />
  <rect x="0" y="164" width="240" height="16" fill="#5a3126" />
  <line x1="0" y1="136" x2="240" y2="136" stroke="#efebe2" stroke-width="2.6" />

  <!-- The grind rail, standing on the sidewalk -->
  <g>
    <rect x="30" y="118" width="3" height="18" fill="#3d4b58" />
    <rect x="70" y="118" width="3" height="18" fill="#3d4b58" />
    <rect x="110" y="118" width="3" height="18" fill="#3d4b58" />
    <rect x="22" y="115" width="100" height="4.2" rx="2.1" fill="#55606b" />
    <rect x="23" y="115.6" width="98" height="1.3" rx="0.65" fill="#d4dce4" />
  </g>

  <!-- The line strung along the rail -->
  <use href="#schlonic-wing" transform="translate(104 104) scale(0.95)" />
  <use href="#schlonic-wing" transform="translate(122 98) scale(0.95)" />
  <use href="#schlonic-wing" transform="translate(140 94) scale(0.95)" />
  <use href="#schlonic-wing" transform="translate(158 94) scale(0.95)" />

  <!-- What the sidewalk is furnished with: one standing, with a face -->
  <g stroke="#8e2a52" stroke-width="1.4" stroke-linejoin="round">
    <circle cx="203" cy="132" r="4.4" fill="#f9a3bc" />
    <circle cx="213" cy="132" r="4.4" fill="#f9a3bc" />
    <path d="M 202 134 C 210 124 212 112 208 102 C 206 96 212 92 216 96 C 221 102 220 120 211 134 Z" fill="#f9a3bc" />
    <circle cx="212" cy="96" r="7.4" fill="#f9a3bc" />
  </g>
  <path d="M 209 104 C 211 110 212 116 210 124" fill="none" stroke="#c4577f" stroke-width="1" stroke-linecap="round" />
  <circle cx="209" cy="94" r="2.5" fill="#fff7ed" />
  <circle cx="215.8" cy="94" r="2.5" fill="#fff7ed" />
  <circle cx="208.5" cy="94.4" r="1.25" fill="#1c0d02" />
  <circle cx="215.3" cy="94.4" r="1.25" fill="#1c0d02" />
  <path d="M 209 100 Q 212.4 102.4 215.8 100" fill="none" stroke="#8e2a52" stroke-width="1" stroke-linecap="round" />

  <!-- The hen, grinding: the cast bird on its board, the board's trucks locked on the rail -->
  <g transform="translate(66 113) rotate(-5)">
    <!-- The board: a black deck with a kicked tail and nose, red under the grip, white wheels -->
    <path d="M -20 -2.4 Q -23 -6 -22 -7.2 L -19 -3.6 L 19 -3.6 L 22 -7.2 Q 23 -6 20 -2.4 Z" fill="#1c1c1c" />
    <rect x="-19" y="-3" width="38" height="1.4" fill="#e8453c" />
    <rect x="-13" y="-1.6" width="5" height="2" fill="#9aa6b5" />
    <rect x="8" y="-1.6" width="5" height="2" fill="#9aa6b5" />
    <circle cx="-14.5" cy="1.4" r="2.2" fill="#f4f6fa" stroke="#1c1c1c" stroke-width="0.8" />
    <circle cx="-6.5" cy="1.4" r="2.2" fill="#f4f6fa" stroke="#1c1c1c" stroke-width="0.8" />
    <circle cx="6.5" cy="1.4" r="2.2" fill="#f4f6fa" stroke="#1c1c1c" stroke-width="0.8" />
    <circle cx="14.5" cy="1.4" r="2.2" fill="#f4f6fa" stroke="#1c1c1c" stroke-width="0.8" />
    <!-- Legs down to the deck -->
    <path d="M -6 -16 L -8 -4 M 6 -16 L 9 -4" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" />
    <path d="M -11 -4 L -5 -4 M 6 -4 L 12 -4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <g transform="translate(0 -30) scale(0.62) translate(-40 -36)" fill="#34b86b" stroke="#0e3a22" stroke-width="2.4" stroke-linejoin="round">
      <path d="M 22 46 C 10 47 2 41 0 30 C 6 39 14 42 26 41 Z M 22 41 C 11 40 3 33 2 20 C 9 31 15 36 25 36 Z M 24 36 C 14 32 8 24 11 10 C 14 25 19 30 28 31 Z" />
      <path d="M 16 42 C 16 28 32 22 50 27 C 64 31 67 44 61 55 C 53 65 30 66 21 58 C 16 54 16 48 16 42 Z" />
      <path d="M 47 13 C 46 5 52 3 54 9 C 55 2 61 2 62 8 C 63 4 68 5 66 13 Z" fill="#e8453c" />
      <circle cx="58" cy="20" r="12" />
      <path d="M 69 20 L 79 17 L 69 24 Z" fill="#f59e0b" />
      <path d="M 47 35 C 38 29 24 33 20 44 C 19 49 21 53 24 55 Q 28 50 31 54 Q 35 49 38 53 Q 42 48 45 51 C 49 46 51 40 47 35 Z" />
      <circle cx="59" cy="18" r="3.2" fill="#fff7ed" stroke="none" />
      <circle cx="60" cy="18" r="1.6" fill="#1c0d02" stroke="none" />
    </g>
    <!-- Sparks off the trucks -->
    <g stroke="#ffd23f" stroke-width="1.1" stroke-linecap="round">
      <path d="M -16 4 L -21 7" /><path d="M -14 5 L -17 9" /><path d="M -12 4 L -12.6 8" />
    </g>
  </g>
</svg>
