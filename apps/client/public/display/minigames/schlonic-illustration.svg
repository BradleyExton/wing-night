<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Schlonic mini-game artwork">
  <defs>
    <linearGradient id="schlonic-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2aa7e0" />
      <stop offset="58%" stop-color="#7fd4f0" />
      <stop offset="100%" stop-color="#bdeafc" />
    </linearGradient>
    <linearGradient id="schlonic-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2b" />
      <stop offset="100%" stop-color="#5b3a1a" />
    </linearGradient>
  </defs>
  <rect width="240" height="180" fill="url(#schlonic-sky)" />
  <circle cx="206" cy="32" r="17" fill="#ffe066" opacity="0.9" />
  <ellipse cx="44" cy="28" rx="17" ry="7" fill="#f4fbff" opacity="0.85" />
  <ellipse cx="56" cy="24" rx="11" ry="6" fill="#f4fbff" opacity="0.85" />
  <path d="M -20 118 Q 40 72 100 118 Q 160 72 220 118 L 260 180 L -20 180 Z" fill="#7fd4a8" opacity="0.7" />
  <path d="M -20 136 Q 30 102 80 136 Q 130 102 180 136 Q 220 110 260 136 L 260 180 L -20 180 Z" fill="#4fb87c" opacity="0.85" />

  <!-- The hill, cut by a hole on the right -->
