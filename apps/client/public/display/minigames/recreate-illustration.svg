  <g stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="72" cy="318" r="16" stroke="#22C55E" />
    <path d="M63 318l7 7 12-14" stroke="#22C55E" />
    <circle cx="128" cy="318" r="16" stroke="#22C55E" />
    <path d="M119 318l7 7 12-14" stroke="#22C55E" />
    <circle cx="184" cy="318" r="16" stroke="#A3A3A3" />
  </g>
</svg>
