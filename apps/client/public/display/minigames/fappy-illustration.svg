<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Fappy Bird mini-game artwork">
  <defs>
    <!-- The corridor's golden afternoon: deep blue overhead going to honey at the horizon -->
    <linearGradient id="fappy-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a73ad" />
      <stop offset="40%" stop-color="#78a9cc" />
      <stop offset="62%" stop-color="#d9d3ad" />
      <stop offset="78%" stop-color="#f1d49a" />
    </linearGradient>
    <radialGradient id="fappy-sun-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f7c35f" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f7c35f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="240" height="180" fill="url(#fappy-sky)" />
  <circle cx="200" cy="36" r="30" fill="url(#fappy-sun-glow)" />
  <circle cx="200" cy="36" r="11" fill="#fff3cf" />

  <!-- Across Kempenfelt Bay: downtown's slabs, City Hall's spire and the twin condos, hazed gold -->
  <g opacity="0.85">
    <g fill="#b9a4a1">
      <rect x="6" y="92" width="10" height="24" />
      <rect x="18" y="80" width="9" height="36" />
      <rect x="29" y="96" width="13" height="20" />
      <rect x="98" y="88" width="10" height="28" />
      <rect x="110" y="98" width="14" height="18" />
    </g>
    <path d="M 60 116 L 60 96 L 76 96 L 76 116 Z M 66 96 L 68 82 L 70 96 Z" fill="#9d8a8d" />
    <g fill="#f8e6bd" opacity="0.55">
      <rect x="20" y="84" width="5" height="1.6" /><rect x="20" y="90" width="5" height="1.6" /><rect x="20" y="96" width="5" height="1.6" />
      <rect x="100" y="92" width="6" height="1.6" /><rect x="100" y="98" width="6" height="1.6" />
    </g>
    <!-- The condos: cream towers with blue down their corners -->
    <rect x="146" y="82" width="12" height="34" fill="#dccab0" />
    <rect x="158" y="82" width="3.5" height="34" fill="#b8a593" />
    <rect x="146" y="82" width="2.2" height="34" fill="#91aebd" />
    <rect x="155.6" y="82" width="2.2" height="34" fill="#91aebd" />
    <rect x="166" y="76" width="13" height="40" fill="#dccab0" />
    <rect x="179" y="76" width="3.8" height="40" fill="#b8a593" />
    <rect x="166" y="76" width="2.4" height="40" fill="#91aebd" />
    <rect x="176.4" y="76" width="2.4" height="40" fill="#91aebd" />
    <rect x="0" y="113" width="240" height="3" fill="#98a58a" />
  </g>
  <rect x="0" y="116" width="240" height="8" fill="#7fa6b8" />
  <rect x="0" y="116" width="240" height="2" fill="#b9c9bf" />
  <g fill="#fff4d6" opacity="0.6">
    <rect x="186" y="119" width="9" height="1" /><rect x="200" y="121" width="7" height="1" /><rect x="176" y="121" width="5" height="1" />
  </g>

