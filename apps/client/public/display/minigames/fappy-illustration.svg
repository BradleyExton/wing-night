  <g>
    <rect x="58" y="120" width="26" height="30" fill="#a8695c" />
    <rect x="84" y="124" width="24" height="26" fill="#c9b38f" />
    <rect x="108" y="116" width="34" height="34" fill="#a8695c" />
    <path d="M 106 117 L 110 110 L 140 110 L 144 117 Z" fill="#4e6a5c" />
    <rect x="114" y="119" width="22" height="3.2" fill="#e5dccb" />
    <rect x="142" y="122" width="26" height="28" fill="#c9b38f" />
    <rect x="168" y="119" width="24" height="31" fill="#86534b" />
    <g fill="#62788a">
      <rect x="62" y="125" width="5" height="5" /><rect x="74" y="125" width="5" height="5" />
      <rect x="88" y="128" width="5" height="4" /><rect x="99" y="128" width="5" height="4" />
      <rect x="112" y="125" width="5" height="5" /><rect x="122.5" y="125" width="5" height="5" /><rect x="133" y="125" width="5" height="5" />
      <rect x="146" y="127" width="5" height="4" /><rect x="158" y="127" width="5" height="4" />
      <rect x="172" y="124" width="5" height="5" /><rect x="183" y="124" width="5" height="5" />
    </g>
    <g fill="#5b806c">
      <path d="M 108 134 L 142 134 L 140 137 L 110 137 Z" />
      <path d="M 58 134 L 84 134 L 82 137 L 60 137 Z" />
    </g>
    <rect x="124" y="104" width="1" height="7" fill="#6b4423" />
    <path d="M 125 104 L 131 105.5 L 125 107 Z" fill="#c35b50" />
  </g>

  <!-- The street at the bottom: the promenade in front of the fronts, a kerb, and the asphalt the champs stand in -->
  <rect x="0" y="150" width="240" height="12" fill="#a39a8f" />
  <rect x="0" y="150" width="240" height="1.4" fill="#857c72" />
  <rect x="0" y="162" width="240" height="3" fill="#a2988c" />
  <rect x="0" y="165" width="240" height="15" fill="#47423f" />

  <!-- The start roof: a red-brick block, coping along its top, a rooftop unit -->
  <g stroke="#2e1c14" stroke-width="1.2" stroke-linejoin="round">
    <rect x="-4" y="134" width="56" height="50" fill="#9a4b3a" />
    <rect x="-4" y="131" width="58" height="4" fill="#e4ddcf" />
    <rect x="8" y="121" width="14" height="10" fill="#b7b2a9" />
    <rect x="28" y="115" width="2.4" height="16" fill="#b7b2a9" />
  </g>
  <circle cx="18" cy="126" r="2.2" fill="#77726a" />
  <g fill="#34434f">
    <rect x="6" y="142" width="7" height="8" /><rect x="20" y="142" width="7" height="8" /><rect x="34" y="142" width="7" height="8" />
    <rect x="6" y="155" width="7" height="8" /><rect x="20" y="155" width="7" height="8" /><rect x="34" y="155" width="7" height="8" />
  </g>

  <!-- The landing roof: the buff block, its gold strip, the pennant, and the tower that closes the sky -->
  <g stroke="#2e1c14" stroke-width="1.2" stroke-linejoin="round">
    <rect x="228" y="-4" width="16" height="188" fill="#6f675f" />
    <rect x="182" y="134" width="48" height="50" fill="#c9a26c" />
    <rect x="180" y="131" width="50" height="4" fill="#e4ddcf" />
  </g>
  <g fill="#535a5f">
    <rect x="231" y="10" width="13" height="4" /><rect x="231" y="30" width="13" height="4" /><rect x="231" y="50" width="13" height="4" />
    <rect x="231" y="70" width="13" height="4" /><rect x="231" y="90" width="13" height="4" /><rect x="231" y="110" width="13" height="4" />
  </g>
  <g fill="#34434f">
    <rect x="190" y="142" width="7" height="8" /><rect x="205" y="142" width="7" height="8" />
    <rect x="190" y="155" width="7" height="8" /><rect x="205" y="155" width="7" height="8" />
  </g>
  <line x1="184" y1="129.6" x2="226" y2="129.6" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 3" stroke-linecap="round" />
  <rect x="212" y="108" width="1.6" height="23" fill="#6b4423" />
  <path d="M 213.6 108 L 224 111.5 L 213.6 115 Z" fill="#fbbf24" stroke="#8a4b06" stroke-width="0.8" stroke-linejoin="round" />

  <!-- A champ standing up from the street, with a face -->
  <g stroke="#8e2a52" stroke-width="1.6" stroke-linejoin="round">
    <circle cx="124" cy="163" r="6" fill="#f9a3bc" />
    <circle cx="138" cy="163" r="6" fill="#f9a3bc" />
    <path d="M 122 165 C 128 150 130 128 127 108 C 126 100 135 97 138 104 C 142 122 141 148 139 165 Z" fill="#f9a3bc" />
    <circle cx="133" cy="102" r="10" fill="#f9a3bc" />
  </g>
  <path d="M 131 114 C 134 126 135 138 133 152" fill="none" stroke="#c4577f" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="129" cy="100" r="3" fill="#fff7ed" />
  <circle cx="137.4" cy="100" r="3" fill="#fff7ed" />
  <circle cx="128.4" cy="100.5" r="1.5" fill="#1c0d02" />
  <circle cx="136.8" cy="100.5" r="1.5" fill="#1c0d02" />
  <path d="M 129 107 Q 133.2 110 137.4 107" fill="none" stroke="#8e2a52" stroke-width="1.2" stroke-linecap="round" />

  <!-- A bald eagle hanging in the sky over the gap -->
  <g transform="translate(138 42)" stroke="#1c0d02" stroke-width="1" stroke-linejoin="round">
    <path d="M -2 0 C -10 -10 -20 -12 -26 -6 C -18 -6 -12 -2 -8 3 Z" fill="#5a3a22" />
    <path d="M 2 0 C 10 -12 22 -14 28 -8 C 20 -7 13 -2 9 3 Z" fill="#5a3a22" />
    <ellipse cx="2" cy="3" rx="10" ry="5" fill="#3b2314" />
    <circle cx="-8" cy="0" r="4.2" fill="#f5efe6" />
    <path d="M -12 -0.5 L -16.5 1 L -12 2.6 Z" fill="#f9a51a" />
    <path d="M 11 3 L 17 1 L 17 6 Z" fill="#f5efe6" />
    <circle cx="-9.2" cy="-0.8" r="0.8" fill="#1c0d02" stroke="none" />
  </g>

  <!-- The hen, mid-flap, off the start roof -->
  <g transform="translate(40 50) rotate(-14) scale(0.82)" fill="#f97316" stroke="#121212" stroke-width="2" stroke-linejoin="round">
    <path d="M 20 42 C 8 40 0 26 6 12 C 8 26 14 34 26 36 Z M 22 46 C 6 48 0 36 2 24 C 8 36 16 40 28 40 Z" />
    <path d="M 14 46 C 14 28 30 20 50 26 C 64 30 66 44 60 54 C 52 64 30 66 20 58 C 15 54 14 50 14 46 Z" />
    <path d="M 48 30 L 54 20 L 64 24 L 62 36 Z" />
    <path d="M 26 42 C 34 34 48 36 52 46 C 44 54 32 54 26 46 Z" />
    <circle cx="58" cy="20" r="12" />
    <path d="M 69 15 L 80 20 L 69 25 Z" fill="#fbbf24" />
    <path d="M 46 13 L 49 3 L 53 10 L 57 1 L 61 9 L 65 4 L 66 13 Z" transform="translate(2 -1)" />
    <circle cx="54" cy="18" r="3" fill="#fff7ed" stroke="none" />
    <circle cx="62" cy="18" r="3" fill="#fff7ed" stroke="none" />
    <circle cx="55" cy="18" r="1.4" fill="#121212" stroke="none" />
    <circle cx="63" cy="18" r="1.4" fill="#121212" stroke="none" />
  </g>
  <text x="120" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="2" fill="#fbbf24">TAP TO FLAP</text>
</svg>
